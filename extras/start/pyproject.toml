[project]
name = "labbstart"
version = "0.2.0"
description = "CLI tool to kickstart Django projects with labb"
authors = [
    {name = "zadiq", email = "dev@zadiq.com"}
]
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
keywords = [
    "django",
    "ui",
    "components",
    "library",
    "starter",
    "cli",
    "django-cotton",
    "tailwind",
    "daisyui",
]
requires-python = ">=3.9,<4"
packages = [{include = "labbstart"}]
dependencies = [
    "typer (>=0.19.2,<0.20.0)",
    "rich (>=14.2.0,<15.0.0)",
    "questionary (>=2.0.0,<3.0.0)",
]

[project.scripts]
labbstart = "labbstart.cli.main:app"

[project.urls]
Documentation = "https://labb.io"
Source = "https://github.com/labbhq/labb/tree/main/extras/start"
Discussions = "https://github.com/labbhq/labb/discussions"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "labbstart.tests.settings"
markers = [
    "integration: marks tests as integration tests (require full environment with poetry, uv, node)",
]
