{% load lb_tags %}
<c-vars
    size="sm"
    :tile="{'xs':'w-6 h-6 rounded-md','sm':'w-8 h-8 rounded-lg','md':'w-10 h-10 rounded-xl','lg':'w-12 h-12 rounded-xl'}"
    :icon="{'xs':'w-4 h-4','sm':'w-5 h-5','md':'w-6 h-6','lg':'w-7 h-7'}"
/>

<span class="inline-flex shrink-0 items-center justify-center border border-base-300 bg-base-100 {{ tile|get_dict_item:size }}" {{ attrs }}>
    <svg viewBox="0 0 48 48" class="{{ icon|get_dict_item:size }}" aria-hidden="true">
        <defs>
            <linearGradient id="lbb-mark" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#8b5cf6"/>
                <stop offset=".4" stop-color="#d946ef"/>
                <stop offset=".72" stop-color="#f472b6"/>
                <stop offset="1" stop-color="#fb923c"/>
            </linearGradient>
        </defs>
        <rect x="9"     y="27" width="7.5" height="12" rx="3.75" fill="url(#lbb-mark)" opacity=".82"/>
        <rect x="20.25" y="19" width="7.5" height="20" rx="3.75" fill="url(#lbb-mark)" opacity=".92"/>
        <rect x="31.5"  y="11" width="7.5" height="28" rx="3.75" fill="url(#lbb-mark)"/>
    </svg>
</span>
