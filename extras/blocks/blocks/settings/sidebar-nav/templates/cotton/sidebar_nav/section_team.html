<c-vars :workspace="{}" :members="[]" />

<c-sidebar-nav.panel
    title="Team"
    desc="Everyone with a seat on {{ workspace.name }}.">

    <c-slot name="actions">
        <c-lb.button variant="primary" size="sm" icon="rmx.user-add">Invite</c-lb.button>
    </c-slot>

    <div class="rounded-box border border-base-300 divide-y divide-base-300">
        {% for member in members %}
        <div class="flex items-center gap-4 p-4">
            <c-lb.avatar placeholder initials="{{ member.initials }}" bgColor="{{ member.tone }}" size="sm" />
            <div class="min-w-0 flex-1">
                <div class="text-sm font-medium truncate">{{ member.name }}</div>
                <div class="text-xs text-base-content/50 truncate">{{ member.title }} · {{ member.email }}</div>
            </div>
            <c-lb.badge size="sm" style="soft" variant="{{ member.tone }}">{{ member.role }}</c-lb.badge>
            <div class="hidden sm:block text-xs text-base-content/45 tabular-nums w-28 text-right">
                {{ member.last_seen }}
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="flex items-center justify-between gap-4 text-xs text-base-content/50">
        <span class="tabular-nums">
            {{ workspace.seats_used }} of {{ workspace.seats_total }} seats used on {{ workspace.plan }}
        </span>
        <span>Two invitations are still pending.</span>
    </div>

</c-sidebar-nav.panel>
