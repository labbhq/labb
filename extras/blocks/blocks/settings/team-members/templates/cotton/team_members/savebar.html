<div
    id="tm-savebar"
    class="sticky bottom-4 flex flex-wrap items-center justify-between gap-4
           rounded-box border border-warning/40 bg-base-100 shadow-lg p-4"
    data-show="Object.keys($roles).filter(k => $roles[k] !== $saved[k]).length > 0"
    style="display:none"
>

    <div class="flex items-center gap-3">
        <c-lbi n="rmx.error-warning" w="1em" h="1em" class="size-5 text-warning shrink-0" />
        <div class="text-sm">
            <span class="font-medium tabular-nums">
                <span id="tm-pending"
                      data-text="Object.keys($roles).filter(k => $roles[k] !== $saved[k]).length">0</span>
                role change<span data-show="Object.keys($roles).filter(k => $roles[k] !== $saved[k]).length !== 1"
                                 style="display:none">s</span>
            </span>
            <span class="text-base-content/55">not saved yet.</span>
        </div>
    </div>

    <div class="flex items-center gap-2">
        <c-lb.button
            id="tm-discard"
            type="button"
            btnStyle="ghost"
            size="sm"
            data-on:click="$roles = Object.assign({}, $saved)"
        >Discard</c-lb.button>

        <c-lb.button id="tm-save" type="button" variant="primary" size="sm">Save roles</c-lb.button>
    </div>

</div>
