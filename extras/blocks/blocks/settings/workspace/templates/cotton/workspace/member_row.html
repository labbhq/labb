<c-vars :member="None" />

<tr id="member-{{ member.pk }}">

    <td>
        <div class="flex items-center gap-3">
            <c-lb.avatar
                placeholder
                initials="{{ member.initials }}"
                bgColor="{{ member.role_variant }}"
                size="sm" />
            <div class="min-w-0">
                <div class="font-medium truncate">{{ member.name }}</div>
                <div class="text-xs text-base-content/50 truncate">
                    {{ member.title|default:"No title" }} · {{ member.email }}
                </div>
            </div>
        </div>
    </td>

    <td>
        <c-lb.badge size="sm" style="soft" variant="{{ member.role_variant }}">
            {{ member.get_role_display }}
        </c-lb.badge>
    </td>

    <td>
        <c-lb.badge size="sm" style="outline" variant="{{ member.status_variant }}">
            {{ member.get_status_display }}
        </c-lb.badge>
    </td>

    <td class="text-sm tabular-nums text-base-content/60 whitespace-nowrap">
        {% if member.last_active_at %}
        {{ member.last_active_at|timesince }} ago
        {% else %}
        <span class="text-base-content/40">Never signed in</span>
        {% endif %}
    </td>

</tr>
