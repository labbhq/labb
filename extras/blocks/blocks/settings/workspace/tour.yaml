steps:
  - title: Name the zones that can change
    file: templates/pages/index.html
    match: '<c-lbr.target name="section-profile"'
    teaches: [scoped-morph]
    docs: [reactivity/morphing]
    body: |
      Each tab wraps its section in a named target. A target is just a div with a
      name the server can aim at — the profile, the team and the billing zones can
      now be replaced one at a time, and everything outside them is untouchable.

  - title: Bind the fields to signals
    file: templates/cotton/workspace/profile.html
    match: ':bind=signals.fields.slug'
    teaches: [signals, binding]
    docs: [reactivity/signals, reactivity/binding]
    body: |
      The address input writes straight into the `profile.slug` signal. The
      preview line under it reads the same signal, so `arden.app/w/…` updates as
      you type. No handler, no JavaScript.

  - title: Validate while the user types
    file: templates/cotton/workspace/field.html
    match: "<c-lbr.post"
    through: 'on="{{ on }}"'
    teaches: [server-actions, live-validation]
    docs: [reactivity/actions]
    body: |
      Every field is wrapped in a debounced POST to a normal Django view. The
      view checks the signals and answers with the section — so an error appears
      under the field the moment it is wrong, and disappears the moment it isn't.

  - title: Save one section, patch one zone
    file: views.py
    match: "def profile_save"
    through: '"Profile saved",'
    teaches: [scoped-morph, server-actions, live-validation]
    docs: [reactivity/actions, reactivity/morphing]
    body: |
      This is the whole point of the block. Validation is strict on save; if it
      passes, the view writes the workspace and answers with exactly two patches
      — the profile zone and the toast. The team table and the billing tables are
      never re-rendered, never re-queried, and never lose their scroll position.

  - title: A toast is just another zone
    file: templates/cotton/workspace/toast.html
    match: 'data-init="setTimeout'
    teaches: [scoped-morph]
    docs: [reactivity/morphing]
    body: |
      The toast is not a special mechanism — it is an empty target on the page
      that a save patches content into. It removes itself after five seconds, and
      an empty patch would clear it just as well.

  - title: Patch every zone the change touches — and only those
    file: views.py
    match: "def plan_change"
    through: '_patch_toast(request, "Plan changed"'
    teaches: [scoped-morph, server-actions]
    docs: [reactivity/morphing]
    body: |
      Scoped morphing puts the staleness question on you. A seat allowance comes
      from the plan, so changing plan really does change the team section too —
      and the response patches both. Downgrading below the seats in use is
      refused, and that error lands in the billing zone alone.
