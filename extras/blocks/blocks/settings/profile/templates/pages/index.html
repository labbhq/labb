<script>
    function ardenPickAvatar(evt) {
        var file = evt.target.files && evt.target.files[0];
        if (!file) {
            return {url: '', name: ''};
        }
        return {url: URL.createObjectURL(file), name: file.name};
    }
</script>

<c-lbr.signals id="profile-avatar" :$avatar=avatar />

<main class="container mx-auto max-w-5xl px-4 py-10 sm:py-14 flex flex-col gap-8">

    <c-profile-card.header :member=member />

    <div class="grid lg:grid-cols-[1fr_18rem] gap-8">

        <div class="flex flex-col gap-6">
            <c-profile-card.avatar :member=member />
            <c-profile-card.details :member=member :timezones=timezones />
        </div>

        <aside class="flex flex-col gap-6">
            <c-profile-card.security :member=member :sessions=sessions />
            <c-profile-card.activity :activity=activity />
        </aside>

    </div>

</main>
