<c-vars title="" note="" actions="" class="" />

<c-lb.card border class="bg-base-100 {{ class }}">
    <c-lb.card.body class="gap-4 p-5">

        <div class="flex flex-wrap items-start justify-between gap-3">
            <div>
                <h2 class="font-semibold tracking-tight">{{ title }}</h2>
                {% if note %}<p class="text-xs text-base-content/50 mt-0.5">{{ note }}</p>{% endif %}
            </div>
            {{ actions }}
        </div>

        {{ slot }}

    </c-lb.card.body>
</c-lb.card>
