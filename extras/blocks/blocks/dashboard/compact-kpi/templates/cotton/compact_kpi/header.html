<c-vars period="" synced="" />

<header class="flex flex-wrap items-end justify-between gap-4 border-b border-base-300 pb-5">

    <div class="flex flex-col gap-1">
        <div class="flex items-center gap-2">
            <c-arden.mark size="xs" />
            <span class="text-sm font-medium text-base-content/50">Arden · Revenue</span>
        </div>
        <h1 class="mt-1 text-2xl font-semibold tracking-tight">Close of {{ period }}</h1>
        <p class="text-sm text-base-content/60">
            Eight numbers the revenue meeting always asks for, reconciled overnight.
        </p>
    </div>

    <div class="flex items-center gap-2">
        <c-lb.badge variant="success" style="soft" size="sm" icon="rmx.refresh">
            Synced {{ synced }}
        </c-lb.badge>
        <c-lb.button size="sm" btnStyle="outline" icon="rmx.file-download">Export</c-lb.button>
    </div>

</header>
