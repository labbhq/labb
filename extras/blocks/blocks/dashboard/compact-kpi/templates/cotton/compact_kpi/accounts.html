<c-vars :accounts="[]" />

<c-lb.card border class="bg-base-100">
    <c-lb.card.body class="gap-4 p-5">

        <div>
            <h2 class="font-semibold tracking-tight">Largest accounts</h2>
            <p class="text-xs text-base-content/50 mt-0.5">Top five by MRR, with today's health.</p>
        </div>

        <ul id="top-accounts" class="flex flex-col divide-y divide-base-200">
            {% for account in accounts %}
            <li class="flex items-center gap-3 py-2.5">
                <c-lb.avatar
                    placeholder
                    size="xs"
                    rounded="lg"
                    bgColor="{{ account.tone }}"
                    initials="{{ account.name|slice:':2'|upper }}" />

                <div class="min-w-0 flex-1 leading-tight">
                    <p class="truncate text-sm font-medium">{{ account.name }}</p>
                    <p class="text-xs text-base-content/50">{{ account.plan }} · {{ account.health }}</p>
                </div>

                <span class="text-sm font-medium tabular-nums">{{ account.mrr }}</span>
            </li>
            {% endfor %}
        </ul>

    </c-lb.card.body>
</c-lb.card>
