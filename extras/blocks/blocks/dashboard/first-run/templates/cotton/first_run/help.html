<c-lb.card border id="first-run-help" class="bg-base-200/60">
    <c-lb.card.body class="gap-4 p-5">

        <div class="flex items-center gap-3">
            <c-lb.avatar placeholder size="md" rounded="full" bgColor="secondary" initials="MC" />
            <div class="leading-tight">
                <p class="text-sm font-medium">Mira Chen</p>
                <p class="text-xs text-base-content/50">Onboarding, Arden</p>
            </div>
        </div>

        <p class="text-sm text-base-content/70">
            "Bring your billing export and I will map it with you. Most teams are reconciled
            against their last close in under half an hour."
        </p>

        <c-lb.button btnStyle="outline" size="sm" modifier="block" icon="rmx.calendar-check">
            Book 20 minutes with Mira
        </c-lb.button>

        <c-lb.button btnStyle="ghost" size="sm" modifier="block" icon="rmx.book-open">
            Read the setup guide
        </c-lb.button>

    </c-lb.card.body>
</c-lb.card>
