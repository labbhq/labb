steps:
  - title: Three ranges, one signal
    file: templates/pages/index.html
    match: "<c-lbr.signals"
    teaches: [signals]
    docs: [reactivity/signals]
    body: |
      Every window the dashboard can show ships with the page, and one signal holds
      the one currently on screen — its labels, its summary numbers and all three of
      its chart datasets. There is no analytics view behind this block.

  - title: A chart bound to a signal path
    file: templates/pages/index.html
    match: 'data="$view.mrr"'
    teaches: [charts, reactive-props]
    docs: [ui/chart, reactivity/reactive-props]
    body: |
      `data="$view.mrr"` is the whole reactive-chart API. It is a signal *path*, never
      an expression — that is the rule that shapes this block. Change the signal and
      Chart.js animates to the new series instead of the canvas being rebuilt.

  - title: Swap the whole object, redraw everything
    file: templates/cotton/split_charts/header.html
    match: "data-on:click=\"$view = ardenRange('7d')\""
    teaches: [signals, charts]
    docs: [reactivity/patterns]
    body: |
      Because a reactive prop can only read a path, the display values live *inside*
      the signal. The click handler replaces the object wholesale, so three charts,
      four stats and the caption all land on the new range in one assignment. Open the
      network tab and switch: nothing fires.

  - title: The buttons restyle themselves from the same signal
    file: templates/cotton/split_charts/header.html
    match: 'btnStyle="$view.d7Style:ghost"'
    teaches: [reactive-props]
    docs: [reactivity/reactive-props]
    body: |
      The active range is not a class the JavaScript toggles — it is a prop bound to
      the signal, with the server-rendered fallback after the colon. The page is correct
      before Datastar loads, and labb recomputes the daisyUI classes in the browser.

  - title: Chart colours are theme tokens
    file: templates/cotton/split_charts/panel.html
    match: 'class="bg-base-100 {{ class }}"'
    teaches: [theming, charts]
    docs: [ui/chart, guide/theming]
    body: |
      No chart on this page names a colour. The datasets are labelled `primary`,
      `success` and `error`, resolved from CSS custom properties at draw time, so the
      charts recolour with the theme — which is why a block can never ship a fixed hex.
