steps:
  - title: Compose stats and activity on one page
    file: templates/pages/index.html
    match: "<c-activity-feed.stats"
    teaches: [zero-js]
    docs: [guide/getting-started]
    body: |
      The stats say what moved; the log says why. Pairing them is the whole idea of
      the block — a KPI with no audit trail is a number nobody trusts. All of it is
      server-rendered HTML, and the page ships no JavaScript at all.

  - title: Render events with the timeline component
    file: templates/cotton/activity_feed/day.html
    match: '<c-lb.timeline direction="vertical" compact snap>'
    teaches: [zero-js]
    docs: [ui/components/timeline]
    body: |
      One `c-lb.timeline` per day, one `c-lb.timeline.item` per event. The rail, the
      connectors and the icon slot come for free; the block only supplies the time on
      the left and the event card on the right.

  - title: Choose event colours from data
    file: templates/cotton/activity_feed/event.html
    match: "{% if event.tone == 'error' %}text-error"
    teaches: [theming]
    docs: [guide/theming]
    body: |
      An upgrade is `success`, a downgrade is `error`, a risk flag is `warning`. The
      event carries a semantic tone and the template maps it to a theme token, so the
      feed reads correctly in every daisyUI theme without a single fixed colour.
