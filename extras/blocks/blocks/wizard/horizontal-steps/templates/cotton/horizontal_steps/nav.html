<div class="flex items-center justify-between gap-4 border-t border-base-300 pt-5">

    <c-lb.button
        id="hz-back"
        type="button"
        btnStyle="ghost"
        size="sm"
        icon="rmx.arrow-left"
        disabled
        data-attr:disabled="$step === 1"
        data-on:click="$step = Math.max($step - 1, 1)"
    >Back</c-lb.button>

    <div id="hz-count" class="text-xs text-base-content/50 tabular-nums">
        Step <span data-text="$step">1</span> of 3
    </div>

    <div>
        <c-lb.button
            id="hz-next"
            type="button"
            variant="primary"
            size="sm"
            icon.end="rmx.arrow-right"
            data-show="$step < 3"
            data-on:click="$step = Math.min($step + 1, 3)"
        >Continue</c-lb.button>

        <c-lb.button
            id="hz-finish"
            type="button"
            variant="primary"
            size="sm"
            icon="rmx.check"
            data-show="$step === 3"
            style="display:none"
        >Create workspace</c-lb.button>
    </div>

</div>
