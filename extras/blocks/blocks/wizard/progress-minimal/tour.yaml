steps:
  - title: Declare the step and answer state
    file: templates/pages/index.html
    match: "<c-lbr.signals"
    teaches: [signals, multi-step]
    docs: [reactivity/signals]
    body: |
      Three signals and no server. `tone` exists so a component prop can track it —
      a reactive prop takes a signal path, never an expression, so the value has to
      live somewhere.

  - title: Render progress from the current step
    file: templates/cotton/minimal_wizard/progress.html
    match: 'data-attr:value="$step * 25"'
    teaches: [signals]
    docs: [reactivity/patterns]
    body: |
      No circles, no connectors: an attribute computed from the step. The server
      renders the opening value, so the bar is already at 25% before any JavaScript
      arrives.

  - title: Drive the completion badge from state
    file: templates/cotton/minimal_wizard/progress.html
    match: 'variant="$tone:primary"'
    teaches: [reactive-props]
    docs: [reactivity/reactive-props]
    body: |
      A reactive prop. The part after the colon is the server-rendered fallback; when
      `tone` changes, labb recomputes the daisyUI classes in the browser. This is why
      the tone is a signal rather than an inline ternary — the prop parser only takes
      a path, never an expression.

  - title: Advance the step and update the tone
    file: templates/cotton/minimal_wizard/nav.html
    match: "data-on:click=\"$step = Math.min($step + 1, 4); $tone ="
    teaches: [signals, multi-step]
    docs: [reactivity/patterns]
    body: |
      One click, two assignments, zero requests. Going back runs the same arithmetic
      in reverse and every answer is still in the bag, because nothing ever took it out.

  - title: Bind fields to the answer state
    file: templates/cotton/minimal_wizard/step_model.html
    match: 'data-bind="form.model"'
    teaches: [binding]
    docs: [reactivity/binding]
    body: |
      The radio writes `form.model`. There is no step-local state to reconcile —
      that is the whole reason back and forth is free here.
