<div class="flex flex-col gap-4">

    <h2 class="text-xl font-semibold tracking-tight">Who else needs to see the numbers?</h2>
    <p class="text-sm text-base-content/60">
        One is enough to start. Finance is the usual answer.
    </p>

    <c-lb.input
        id="mw-invite"
        type="email"
        placeholder="peter.vance@northwind.co"
        size="lg"
        class="w-full"
        bind="form.invite" />

    <div class="flex items-center gap-3 rounded-box bg-base-200/60 p-4">
        <c-lb.avatar placeholder initials="TA" bgColor="primary" size="sm" />
        <p class="text-xs text-base-content/60 leading-relaxed">
            “Four questions and we had a forecast the same afternoon. Nobody scheduled a
            kickoff call.”
            <span class="text-base-content/45">— Tom Ainsworth, Head of Revenue, Beacon Labs</span>
        </p>
    </div>

</div>
