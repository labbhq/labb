<div class="flex flex-col gap-4">

    <h2 class="text-xl font-semibold tracking-tight">What should we call your workspace?</h2>
    <p class="text-sm text-base-content/60">
        Usually the company name. Your team sees it every time they sign in.
    </p>

    <c-lb.input
        id="mw-company"
        type="text"
        placeholder="Northwind Co"
        size="lg"
        class="w-full"
        bind="$form.company" />

    <p class="text-xs text-base-content/45">You can rename it later without breaking any links.</p>

</div>
