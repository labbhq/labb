<c-vars :models="[]" />

<div class="flex flex-col gap-4">

    <h2 class="text-xl font-semibold tracking-tight">How do you charge?</h2>
    <p class="text-sm text-base-content/60">
        This decides how Arden calculates MRR, and which churn figure it shows you first.
    </p>

    <div class="flex flex-col gap-2">
        {% for model in models %}
        <label class="flex items-start gap-3 rounded-box border border-base-300 p-4 cursor-pointer
                      transition-colors hover:border-base-content/30
                      has-[:checked]:border-primary has-[:checked]:bg-primary/5">
            <c-lb.radio
                name="mw-model"
                variant="primary"
                value="{{ model.value }}"
                data-bind="form.model"
                class="mt-0.5" />
            <div>
                <div class="font-medium text-sm">{{ model.name }}</div>
                <div class="text-xs text-base-content/55 mt-0.5">{{ model.note }}</div>
            </div>
        </label>
        {% endfor %}
    </div>

</div>
