<c-vars aside="" />

<main class="min-h-screen grid lg:grid-cols-3">

    <aside class="relative isolate overflow-hidden hidden lg:flex flex-col justify-between gap-10 p-10
                  bg-base-200 border-r border-base-300">
        <div class="pointer-events-none absolute inset-0 -z-10"
             style="background:
                radial-gradient(60% 48% at 12% 0%, #312e81 0%, transparent 70%),
                radial-gradient(56% 44% at 92% 20%, #0f766e 0%, transparent 70%),
                radial-gradient(70% 56% at 50% 105%, #65a30d 0%, transparent 74%);
                opacity: 0.13;"
             aria-hidden="true"></div>
        {{ aside }}
    </aside>

    <section class="lg:col-span-2 flex justify-center p-6 sm:p-12 bg-base-100">
        <div class="w-full max-w-2xl">
            {{ slot }}
        </div>
    </section>

</main>
