<c-vars label="" hint="" error="" class="" />

<div class="{{ class }}">
    {% if label %}
    <label class="label label-text text-sm font-medium mb-1">
        {{ label }}
        {% if hint %}<span class="text-base-content/40 font-normal">{{ hint }}</span>{% endif %}
    </label>
    {% endif %}

    {{ slot }}

    {% if error %}
    <p class="text-error text-xs mt-1">{{ error }}</p>
    {% endif %}
</div>
