<c-lbr.signals id="sw-wizard" :$step=step :$form=form :$plans=plans :$seatprice=seat_price />

<main class="container mx-auto max-w-6xl px-4 py-10 sm:py-14">

    <div class="grid lg:grid-cols-[1fr_22rem] gap-8">

        <div class="flex flex-col gap-6">

            <c-summary-wizard.stepper :steps=steps />

            <c-lb.card class="border border-base-300 shadow-sm">
                <c-lb.card.body class="gap-7 p-6 sm:p-8">

                    <div data-show="$step === 1">
                        <c-summary-wizard.step-workspace />
                    </div>

                    <div data-show="$step === 2" style="display:none">
                        <c-summary-wizard.step-plan :plan_list=plan_list :seat_price=seat_price />
                    </div>

                    <div data-show="$step === 3" style="display:none">
                        <c-summary-wizard.step-billing />
                    </div>

                    <c-summary-wizard.nav />

                </c-lb.card.body>
            </c-lb.card>

        </div>

        <c-summary-wizard.summary :seat_price=seat_price />

    </div>

</main>
