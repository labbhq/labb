steps:
  - title: The page is an outline
    file: templates/pages/index.html
    match: "<c-highlight-tiers.tier :plan=plan />"
    teaches: [zero-js]
    docs: [guide/components]
    body: |
      One loop over three plans, then the proof strip. All the card markup lives in the
      tier component, so the page stays readable at a glance.

  - title: The featured card is built from theme tokens
    file: templates/cotton/highlight_tiers/tier.html
    match: "border-primary border-2 shadow-lg ring-1 ring-primary/20"
    teaches: [theming]
    docs: [guide/theming]
    body: |
      The middle plan is lifted with border, elevation and a `primary` ring — every
      cue a theme token, so it recolours with the theme instead of fighting it. The
      cards stay the same size; only fill and border say which one is featured.

  - title: No script tag, anywhere
    file: templates/pages/index.html
    match: "<main class="
    teaches: [zero-js]
    docs: [guide/zero-js]
    body: |
      Nothing on this page is reactive, so nothing loads Datastar. labb only ships the
      runtime when a `c-lbr.*` component or a `$`-prefixed prop asks for it — which is
      why a static pricing page here weighs what static HTML weighs.
