<main class="container mx-auto max-w-5xl px-4 py-24 lg:py-32">

    <div class="flex flex-col items-center text-center">

        <c-lb.badge variant="primary" style="soft" icon="rmx.shield-check">
            SOC 2 Type II · Read-only billing access
        </c-lb.badge>

        <h1 class="mt-5 text-4xl sm:text-5xl lg:text-6xl font-semibold tracking-tight text-balance max-w-3xl">
            Revenue ops your finance team will actually trust.
        </h1>

        <p class="mt-5 text-lg text-base-content/70 max-w-xl text-balance">
            Arden reconciles billing, plans and renewals every night, then shows you
            the delta. Every number traces back to an invoice you can open.
        </p>

        <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
            <c-lb.button variant="primary" icon.end="rmx.arrow-right">
                Start free trial
            </c-lb.button>
            <c-lb.button btnStyle="ghost" icon="rmx.calendar-check">
                Talk to our team
            </c-lb.button>
        </div>

    </div>

    <c-with-logos.cloud :customers=customers />

</main>
