<main class="overflow-hidden">

    <section class="container mx-auto max-w-3xl px-4 pt-24 pb-12 text-center">

        <div class="flex flex-col items-center">

            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-semibold tracking-tight text-balance">
                See the quarter before it lands.
            </h1>

            <p class="mt-5 text-lg text-base-content/70 max-w-xl text-balance">
                Arden watches every renewal, flags the ones drifting and tells you what
                each will cost. Forty-six days of warning, on average.
            </p>

            <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
                <c-lb.button variant="primary" icon.end="rmx.arrow-right">
                    Start free trial
                </c-lb.button>
                <c-lb.button btnStyle="ghost" icon="rmx.play-circle">
                    Watch the 3-minute tour
                </c-lb.button>
            </div>

            <c-app-screenshot.trust />

        </div>

    </section>

    <c-app-screenshot.shot />

    <section class="container mx-auto max-w-4xl px-4 py-16">
        <c-app-screenshot.metrics />
    </section>

</main>
