<div class="mt-20 grid items-stretch gap-6 lg:grid-cols-5">

    <c-lb.card class="lg:col-span-3 h-full border border-base-300 bg-base-100 shadow-sm">
        <c-lb.card.body class="gap-4 p-7">
            <c-lbi.rmx.double-quotes-l w="28" h="28" class="text-base-content/20" />
            <p class="text-lg leading-relaxed text-balance">
                &ldquo;We stopped guessing at churn. The first renewal Arden flagged
                covered the year &mdash; and we found it forty-six days before the invoice
                went out.&rdquo;
            </p>
            <div class="mt-auto flex items-center gap-3 pt-2">
                <c-lb.avatar placeholder initials="MC" bgColor="neutral" size="sm" />
                <div class="text-sm">
                    <div class="font-medium">Mira Chen</div>
                    <div class="text-base-content/50">Founder, AtlasForge</div>
                </div>
            </div>
        </c-lb.card.body>
    </c-lb.card>

    <c-lb.card class="lg:col-span-2 h-full border border-base-300 bg-base-100 shadow-sm">
        <c-lb.card.body class="justify-center divide-y divide-base-200 p-0">
            <div class="px-7 py-5">
                <div class="text-3xl font-semibold tabular-nums tracking-tight">$2.4B</div>
                <div class="mt-1 text-xs text-base-content/50">ARR under management</div>
            </div>
            <div class="px-7 py-5">
                <div class="text-3xl font-semibold tabular-nums tracking-tight">8.1M</div>
                <div class="mt-1 text-xs text-base-content/50">Invoices reconciled</div>
            </div>
            <div class="px-7 py-5">
                <div class="text-3xl font-semibold tabular-nums tracking-tight">4 days</div>
                <div class="mt-1 text-xs text-base-content/50">Median time to close the books</div>
            </div>
        </c-lb.card.body>
    </c-lb.card>

</div>
