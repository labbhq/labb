steps:
  - title: Keep a deliberate brand gradient local
    file: templates/cotton/gradient_mesh/mesh.html
    match: "#0f766e"
    teaches: [zero-js]
    docs: [ui/theming]
    body: |
      The one sanctioned fixed-colour exception: a blurred mesh of three curated
      hues, masked so it crowns the hero and fades before the content. It is
      declared in `block.yaml` (`allow_fixed_colours`) precisely because it must
      look the same in light and dark — a brand gradient, not a theme surface.
      Everything under it is still built from daisyUI tokens.

  - title: Use base tokens behind the artwork
    file: templates/pages/index.html
    match: "overflow-hidden bg-base-100"
    teaches: [theming]
    docs: [ui/theming]
    body: |
      A flat `base-100` ground carries the panel — no gradient. It resolves to the
      same token in every theme, which is why the hero never looks like it was
      designed for a theme it is no longer in.

  - title: Keep the hero server-rendered
    file: templates/pages/index.html
    match: "<main"
    teaches: [zero-js]
    docs: [guide/getting-started]
    body: |
      No canvas, no WebGL, no animation loop — the whole effect is CSS on
      server-rendered markup. Nothing to download and nothing to run.

  - title: Layer content above the visual
    file: templates/pages/index.html
    match: "<c-gradient-mesh.proof"
    teaches: [zero-js]
    docs: [guide/getting-started]
    body: |
      Decoration is not a value proposition. The testimonial and the numbers sit
      on clean cards below the headline, so the block still says something once
      the styling is stripped away.
