<main class="container mx-auto max-w-6xl px-4 py-20 lg:py-28">

    <div class="grid items-center gap-12 lg:grid-cols-2">

        <div class="flex flex-col">

            <c-lb.badge variant="primary" style="soft" icon="rmx.sparkling">
                Renewal forecasting is live
            </c-lb.badge>

            <h1 class="mt-5 text-4xl sm:text-5xl lg:text-6xl font-semibold tracking-tight text-balance">
                Know your revenue.
            </h1>

            <p class="mt-5 text-lg text-base-content/70 max-w-md text-balance">
                Every customer, invoice and renewal in one place. Arden reconciles your
                billing data every night and tells you what moved, so the quarter never
                ends in a surprise.
            </p>

            <div class="mt-8 flex flex-wrap items-center gap-3">
                <c-lb.button variant="primary" icon.end="rmx.arrow-right">
                    Start free trial
                </c-lb.button>
                <c-lb.button btnStyle="ghost" icon="rmx.play-circle">
                    Watch the 3-minute tour
                </c-lb.button>
            </div>

            <c-split-visual.proof />

        </div>

        <c-split-visual.shot />

    </div>

</main>
