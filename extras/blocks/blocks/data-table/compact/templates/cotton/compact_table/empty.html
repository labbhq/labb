<c-vars id="" icon="rmx.inbox" title="" body="" action="" />

<div id="{{ id }}" class="flex flex-col items-center gap-3 px-6 py-10 text-center">

    <c-lb.avatar placeholder icon="{{ icon }}" bgColor="neutral" size="sm" rounded="full" />

    <div class="flex flex-col gap-1">
        <h3 class="text-sm font-semibold tracking-tight">{{ title }}</h3>
        <p class="mx-auto max-w-sm text-xs text-base-content/60">{{ body }}</p>
    </div>

    {% if action %}
    <c-lb.button btnStyle="outline" size="xs">{{ action }}</c-lb.button>
    {% endif %}

</div>
