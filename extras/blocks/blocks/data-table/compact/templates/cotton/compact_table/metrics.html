<c-vars :metrics="[]" />

<div id="compact-metrics" class="grid gap-px overflow-hidden rounded-box border border-base-300 bg-base-300 sm:grid-cols-2 xl:grid-cols-4">
    {% for metric in metrics %}
    <div class="flex flex-col gap-1 bg-base-100 px-4 py-3">
        <span class="text-xs font-medium text-base-content/50">{{ metric.label }}</span>
        <span class="text-xl font-semibold tracking-tight tabular-nums">{{ metric.value }}</span>
        <span class="text-xs tabular-nums {% if metric.tone == 'success' %}text-success{% else %}text-base-content/40{% endif %}">
            {{ metric.note }}
        </span>
    </div>
    {% endfor %}
</div>
