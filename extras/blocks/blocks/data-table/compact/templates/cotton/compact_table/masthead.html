<c-vars :total=0 updated="" />

<div class="flex flex-wrap items-end justify-between gap-4">

    <div>
        <div class="flex items-center gap-3">
            <c-arden.mark size="xs" />
            <span class="text-xs font-semibold tracking-tight text-base-content/70">Arden</span>
            <span class="text-xs text-base-content/40">Revenue operations</span>
        </div>
        <h1 class="mt-6 text-2xl font-semibold tracking-tight">Accounts</h1>
        <p class="mt-1 text-sm text-base-content/60 max-w-lg">
            Every account billing through this workspace, on one screen. Built for the person
            who reads it forty times a day, not for a screenshot.
        </p>
    </div>

    <div class="flex items-center gap-2">
        <span class="text-xs text-base-content/40 tabular-nums">Synced {{ updated }}</span>
        <c-lb.button btnStyle="ghost" size="xs" icon="rmx.download">Export</c-lb.button>
        <c-lb.button variant="primary" size="xs" icon="rmx.add">New account</c-lb.button>
    </div>

</div>
