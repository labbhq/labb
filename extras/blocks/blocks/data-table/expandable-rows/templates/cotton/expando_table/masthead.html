<c-vars :total=0 />

<div class="flex flex-wrap items-end justify-between gap-4">

    <div>
        <div class="flex items-center gap-3">
            <c-arden.mark size="xs" />
            <span class="text-xs font-semibold tracking-tight text-base-content/70">Arden</span>
        </div>
        <h1 class="mt-6 text-2xl font-semibold tracking-tight">Accounts</h1>
        <p class="mt-1 text-sm text-base-content/60 max-w-lg">
            Open a row to see the invoices, the owner and what the account has been doing,
            without losing the row you were reading.
        </p>
    </div>

    <div class="flex items-center gap-3">
        <span class="text-xs text-base-content/50 tabular-nums">{{ total }} accounts</span>
        <c-lb.button variant="primary" size="sm" icon="rmx.add">New account</c-lb.button>
    </div>

</div>
