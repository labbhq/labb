<c-vars id="" icon="rmx.inbox" title="" body="" />

<div id="{{ id }}" class="flex flex-col items-center gap-2.5 px-5 py-8 text-center">

    <c-lb.avatar placeholder icon="{{ icon }}" bgColor="neutral" size="sm" rounded="full" />

    <div class="flex flex-col gap-1">
        <h3 class="text-sm font-semibold tracking-tight">{{ title }}</h3>
        <p class="mx-auto max-w-xs text-xs text-base-content/60">{{ body }}</p>
    </div>

</div>
