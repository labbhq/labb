<main class="container mx-auto max-w-6xl px-4 py-10 flex flex-col gap-8">

    <c-account-cards.masthead :total=total :mrr=mrr :seats=seats />

    {% if customers %}
    <div id="account-grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        {% for customer in customers %}
        <c-account-cards.card :customer=customer />
        {% endfor %}
    </div>
    {% else %}
    <div class="rounded-box border border-dashed border-base-300 bg-base-100">
        <c-account-cards.empty
            id="account-grid-empty"
            icon="rmx.building"
            title="No accounts yet"
            body="Arden starts billing the moment an account lands here. Add the first one, or import the book you already have."
            action="Import from CSV" />
    </div>
    {% endif %}

    <c-account-cards.flagged :flagged=flagged />

    <p class="text-xs text-base-content/40 max-w-2xl">
        The health score blends product usage, invoice history and support volume over the
        last thirty days. It is the same number the table view sorts on, drawn here as a bar
        because a card has the room for it.
    </p>

</main>
