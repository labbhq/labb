<div
    id="filter-empty"
    class="flex flex-col items-center gap-3 border-t border-base-300 px-6 py-12 text-center"
    style="display:none"
    data-show="ardenVisible($filters) === 0"
>

    <c-lb.avatar placeholder icon="rmx.filter-off" bgColor="neutral" size="md" rounded="full" />

    <div class="flex flex-col gap-1">
        <h3 class="text-base font-semibold tracking-tight">No account matches those filters</h3>
        <p class="mx-auto max-w-sm text-sm text-base-content/60">
            Nothing in the book sits in that combination of status and health. Widen one of
            them, or clear both and start again.
        </p>
    </div>

    <c-lb.button
        type="button"
        btnStyle="outline"
        size="sm"
        icon="rmx.close-circle"
        data-on:click="$filters = ardenFilters('', '')"
    >Clear filters</c-lb.button>

</div>
