<c-vars :customer="{}" />

<tr
    id="filter-row-{{ customer.initials|lower }}"
    class="border-base-300 hover:bg-base-200/40"
    data-show="ardenMatches('{{ customer.status_key }}', '{{ customer.health_key }}', $filters)"
>

    <td>
        <div class="flex items-center gap-3">
            <c-lb.avatar placeholder initials="{{ customer.initials }}" bgColor="neutral" size="sm" rounded="md" />
            <div class="min-w-0 leading-tight">
                <div class="font-medium truncate">{{ customer.company }}</div>
                <div class="text-xs text-base-content/50 truncate">{{ customer.contact }} · {{ customer.email }}</div>
            </div>
        </div>
    </td>

    <td class="text-base-content/70">{{ customer.plan }}</td>

    <td>
        <c-lb.badge variant="{{ customer.status_variant }}" style="soft" size="sm">{{ customer.status }}</c-lb.badge>
    </td>

    <td>
        <c-lb.badge variant="{{ customer.health_variant }}" style="outline" size="sm">{{ customer.health }}</c-lb.badge>
    </td>

    <td class="text-end tabular-nums font-medium">${{ customer.mrr }}</td>

    <td class="text-end tabular-nums text-base-content/70">{{ customer.seats }}</td>

    <td class="text-end tabular-nums text-base-content/60 whitespace-nowrap">{{ customer.renews }}</td>

</tr>
