<c-lbr.signals id="centred-card-ui" $reveal="false" />

<main class="relative isolate overflow-hidden min-h-screen flex items-center justify-center px-4 py-12 bg-base-100">

    <div class="pointer-events-none absolute inset-x-0 top-0 h-[30rem] -z-10"
         style="background:
            radial-gradient(52% 68% at 18% 0%, #0f766e 0%, transparent 68%),
            radial-gradient(48% 62% at 78% 4%, #1d4ed8 0%, transparent 70%);
            opacity: 0.10;
            -webkit-mask-image: linear-gradient(black, transparent);
            mask-image: linear-gradient(black, transparent);"
         aria-hidden="true"></div>

    <div class="w-full max-w-md flex flex-col gap-6">

        <c-centred-card.mark />

        <c-centred-card.card />

        <c-centred-card.assurance />

    </div>

</main>
