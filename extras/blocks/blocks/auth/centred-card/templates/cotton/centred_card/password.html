<div class="flex flex-col gap-1">

    <label for="cc-password" class="label label-text text-sm font-medium">Password</label>

    <div class="relative">

        <c-lb.input
            id="cc-password"
            type="password"
            name="password"
            class="w-full pr-11"
            autocomplete="current-password"
            placeholder="••••••••"
            data-attr:type="$reveal ? 'text' : 'password'" />

        <button
            id="cc-reveal"
            type="button"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-base-content/50 hover:text-base-content"
            aria-label="Show password"
            data-attr:aria-label="$reveal ? 'Hide password' : 'Show password'"
            data-on:click="$reveal = !$reveal">

            <span data-show="!$reveal">
                <c-lbi n="rmx.eye" w="18" h="18" />
            </span>

            <span data-show="$reveal" style="display: none">
                <c-lbi n="rmx.eye-off" w="18" h="18" />
            </span>

        </button>

    </div>

</div>
