steps:
  - title: Start with the form schema
    file: templates/pages/sign_in.html
    match: "<c-lbr.signals"
    teaches: [signals]
    docs: [reactivity/signals]
    body: The page receives one typed schema from the view. Its fields provide the initial form state and the values Django validates on the next request.

  - title: Bind inputs to schema fields
    file: templates/cotton/split_brand/form.html
    match: ':bind=signals.fields.email'
    teaches: [binding, live-validation]
    docs: [reactivity/binding]
    body: Bind accepts the schema field descriptor, so the input and validation view use the same signal path. The template does not need a hand-written change handler.

  - title: Validate as the user fills the form
    file: templates/cotton/split_brand/field.html
    match: "<c-lbr.post"
    through: 'before="if ($submitted) return"'
    teaches: [server-actions, morphing, live-validation]
    docs: [reactivity/actions]
    body: A debounced POST sends the current signals to Django and returns the refreshed field. The before expression stops background checks once the user submits the form.

  - title: Keep sign-in and sign-up rules together
    file: views.py
    match: "def _validate"
    teaches: [live-validation]
    docs: [reactivity/actions]
    body: Both pages use the same validation helper. The view decides whether a name is required, which keeps the shared fields and error handling in one place.
