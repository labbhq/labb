<c-vars headline="" sub="" />

<div>
    <div class="flex items-center gap-3">
        <c-arden.mark size="sm" />
        <span class="text-lg font-semibold tracking-tight">Arden</span>
    </div>

    <h1 class="mt-10 text-4xl font-semibold tracking-tight text-balance">{{ headline }}</h1>
    <p class="mt-3 text-base-content/60 max-w-sm">{{ sub }}</p>
</div>

<c-lb.card class="bg-base-100/70 backdrop-blur border border-base-300 shadow-sm">
    <c-lb.card.body class="p-5 gap-4">
        <p class="text-sm leading-relaxed">
            “We stopped guessing at churn. Arden paid for itself in a quarter — the
            first renewal it flagged covered the year.”
        </p>
        <div class="flex items-center gap-3">
            <c-lb.avatar placeholder initials="MC" bgColor="secondary" size="sm" />
            <div class="text-xs">
                <div class="font-medium">Mira Chen</div>
                <div class="text-base-content/50">Founder, AtlasForge</div>
            </div>
        </div>
    </c-lb.card.body>
</c-lb.card>

<div>
    <p class="text-xs uppercase tracking-wider text-base-content/40">
        Trusted by 2,400+ finance and ops teams
    </p>
    <div class="mt-3 flex flex-wrap gap-x-5 gap-y-2 text-sm font-medium text-base-content/50">
        <span>Kite &amp; Bell</span>
        <span>Northwind Co</span>
        <span>Verity Labs</span>
        <span>Ironvale Group</span>
    </div>
</div>
