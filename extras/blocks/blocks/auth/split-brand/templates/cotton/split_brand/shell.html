<c-vars brand="" />

<main class="min-h-screen grid lg:grid-cols-2">

    <aside class="relative isolate overflow-hidden hidden lg:flex flex-col justify-between p-12
                  bg-base-200">
        <div class="pointer-events-none absolute inset-0 -z-10"
             style="background:
                radial-gradient(55% 45% at 15% 0%, #8b5cf6 0%, transparent 68%),
                radial-gradient(55% 45% at 88% 25%, #d946ef 0%, transparent 68%),
                radial-gradient(70% 55% at 50% 108%, #f472b6 0%, transparent 70%);
                opacity: 0.14;"
             aria-hidden="true"></div>
        {{ brand }}
    </aside>

    <section class="flex items-center justify-center p-6 sm:p-12 bg-base-100">
        <div class="w-full max-w-sm">
            {{ slot }}
        </div>
    </section>

</main>
