tags:
  - reactive
  - validation
  - form
  - auth
  - oauth
  - demo
changelog:
  - date: "2026-07-14"
    notes:
      - "Initial release — the catalogue's auth anchor and premium exemplar"
  - date: "2026-08-11"
    notes:
      - "Marked as a UI demo: the views never verified a password or stored a credential, and the description implied otherwise"

allow_fixed_colours:
