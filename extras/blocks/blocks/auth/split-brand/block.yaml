name: Split brand
ref: lb/auth/split-brand
type: fullstack
labb_version: ">=0.5.0"
description: "UI demo of sign-in and sign-up on a split brand layout, showing live per-field validation over an ordinary Django view. It does not authenticate anyone: no password is checked, no credential is stored, and no session is started. Replace the views with django.contrib.auth before using it for real."
demo: true
category: auth
status: launch
anchor: true
