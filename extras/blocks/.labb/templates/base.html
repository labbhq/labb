{% load lb_tags %}
<!DOCTYPE html>
<html lang="en" {% labb_theme %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Block Preview{% endblock %}</title>
    <c-lbb.dependencies />
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-100 antialiased">
    <div data-on:popstate__window="@get(location.pathname)" hidden></div>
    {% block body %}{% endblock %}
</body>
</html>
