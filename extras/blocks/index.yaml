blocks:
- ref: lb/auth/centred-card
  name: Centred card
  type: fe
  description: 'The workhorse sign-in UI: a centred card with OAuth, a trust footer,
    and a password reveal driven by one client signal. Markup only, with no server
    behind it, so it does not sign anyone in.'
  category: auth
  tags:
  - auth
  - sign-in
  - oauth
  - reactive
  - zero-server
  status: launch
  thumbnail: thumbnails/centred-card.png
- ref: lb/auth/magic-link
  name: Magic link
  type: fe
  description: 'Passwordless sign-in UI: the form becomes a ''check your inbox'' state
    from one client signal. Markup only, with no server behind it, so it does not
    send a link or sign anyone in.'
  category: auth
  tags:
  - auth
  - sign-in
  - passwordless
  - reactive
  - zero-server
  status: launch
  thumbnail: thumbnails/magic-link.png
- ref: lb/auth/social-proof
  name: Social proof
  type: fe
  description: Sign-in UI under a logo cloud and a rating strip, conversion-shaped
