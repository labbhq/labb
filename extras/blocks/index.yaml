    does not sign anyone in.
  category: auth
  tags:
  - auth
  - sign-in
  - oauth
  - static
  - zero-js
  status: launch
  thumbnail: thumbnails/social-proof.png
- ref: lb/auth/split-brand
  name: Split brand
  type: fullstack
  description: 'UI demo of sign-in and sign-up on a split brand layout, showing live
    per-field validation over an ordinary Django view. It does not authenticate anyone:
    no password is checked, no credential is stored, and no session is started. Replace
    the views with django.contrib.auth before using it for real.'
  category: auth
  tags:
  - reactive
  - validation
  - form
  - auth
  - oauth
  - demo
  status: launch
  thumbnail: thumbnails/split-brand.png
  demo: true
