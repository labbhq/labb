[pytest]
# Own inifile so this suite stops inheriting the repo root's config (its
# addopts pull in xdist, which this suite does not use). Run it from the root
# venv via `task test:docs`: docs/ has its own poetry env without the test deps.
DJANGO_SETTINGS_MODULE = tests.settings
testpaths = labbdocs tests
pythonpath = .
addopts = -q
