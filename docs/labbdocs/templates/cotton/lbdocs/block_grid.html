<c-vars
    title="Explore related blocks"
    refs=""
    :blocks="[]"
/>

{% load docs_tags %}
{% if refs %}{% blocks_by_ref refs as blocks %}{% endif %}

{% if blocks %}
<section class="not-prose my-14">
    <p class="mb-4 text-xs font-semibold uppercase tracking-widest text-base-content/50">{{ title }}</p>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        {% for block in blocks %}
        <c-lbdocs.blocks.card :block=block />
        {% endfor %}
    </div>
</section>
{% endif %}
