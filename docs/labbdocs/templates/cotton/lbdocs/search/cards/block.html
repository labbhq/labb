<c-vars :doc="{}" />

<a href="{{ doc.url }}" class="block rounded-lg px-3 py-2 transition-colors hover:bg-base-200">
    <div class="flex items-baseline justify-between gap-3">
        <div class="flex min-w-0 items-baseline gap-2">
            <span class="truncate text-sm font-medium">{{ doc.title }}</span>
            {% if doc.category %}<span class="shrink-0 text-xs text-base-content/40">{{ doc.category }}</span>{% endif %}
        </div>
        {% if doc.metadata.status %}<span class="shrink-0 text-xs text-base-content/40">{{ doc.metadata.status }}</span>{% endif %}
    </div>
    {% if doc.summary %}<p class="mt-0.5 truncate text-xs text-base-content/50">{{ doc.summary }}</p>{% endif %}
</a>
