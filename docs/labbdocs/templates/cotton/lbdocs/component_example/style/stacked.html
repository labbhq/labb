<c-vars
    class=""
    previewStyle
/>

<div class="codeblock-container relative border border-base-300 rounded-xl overflow-hidden bg-base-100 {{ class }}">

    <div class="absolute top-2 right-2 z-20">
        <c-lb.button
            href="#"
            onclick="copyCodeBlock(this)"
            size="xs"
            variant="ghost"
            class="bg-base-200/80 hover:bg-base-200 text-base-content/60 backdrop-blur copy-code-btn"
        >
            <c-lbi n="rmx.file-copy" w="1em" h="1em" />
        </c-lb.button>
        <span class="copy-notification hidden absolute top-full right-0 mt-1 whitespace-nowrap bg-base-200 text-base-content/70 text-xs px-2 py-1 rounded pointer-events-none">Copied!</span>
    </div>

    <c-lbdocs.component_example.section.preview :style=previewStyle>
        {{ slot }}
    </c-lbdocs.component_example.section.preview>

    <c-lbdocs.component_example.section.code code="{{ code }}" />

</div>
