version: '3'

tasks:
  install:
    desc: Install main project dependencies
    dir: .
    cmds:
      - poetry install --with dev
    sources:
      - pyproject.toml
      - poetry.lock
    generates:
      - poetry.lock

  deps:update:
    desc: Update Python dependencies in labb and all sub-packages
    dir: .
    cmds:
      - poetry update --with dev
      - cd docs && poetry update
      - cd extras/icons && poetry update
      - cd extras/start && poetry update
      - cd extras/blocks && poetry update --with local

  blocks:validate:
    desc: Validate all blocks in extras/blocks conform to spec
    dir: extras/blocks
    deps: [install]
    cmds:
      - poetry run labb block dev validate

  blocks:build:
    desc: Regenerate extras/blocks/index.yaml from block.yaml files
    dir: extras/blocks
    deps: [install]
    cmds:
      - poetry run labb block dev build

  blocks:serve:
    desc: Start the block renderer for live preview
    dir: extras/blocks
    deps: [install]
    cmds:
      - poetry run labb block dev serve
    interactive: true

  blocks:new:
    desc: Scaffold a new block (usage - task blocks:new -- crud/my-block)
    dir: extras/blocks
    deps: [install]
    cmds:
      - poetry run labb block dev new {{.CLI_ARGS}}

  update:
    desc: Refresh Python dependencies and the Chart.js CDN bundle
    cmds:
      - task deps:update
      - task chart:download

  venv:
    desc: Show poetry virtual environment activation instructions
    cmds:
      - echo "To activate the virtual environment, run:"
      - echo "eval \"\$(poetry env activate)\""

  lint:
    desc: Run linting for the project
    dir: .
    deps: [install]
    cmds:
      - poetry run ruff format
      - poetry run ruff check --select I --fix

  check:
    desc: Run checking for the project
    dir: .
    deps: [install]
    cmds:
      - poetry run pre-commit run --all-files

  test:icons:
    desc: Run tests for the icons project
    dir: .
    deps: [install]
    cmds:
      - poetry run pytest extras/icons {{.CLI_ARGS}}

  test:
    desc: Run unit tests and the labbdocs suite
    dir: .
    deps: [install]
    cmds:
      - poetry run pytest {{.CLI_ARGS}}
      - task: test:docs
        vars: {CLI_ARGS: ""}

  test:docs:
    desc: Run the labbdocs suite (search tests need PostgreSQL, else they skip)
    dir: .
    deps: [install]
    cmds:
      # docs/ has its own poetry env without the test deps, so run from the root.
      - poetry run pytest -c docs/pytest.ini docs {{.CLI_ARGS}}

  test:js:
    desc: Run the browser-script tests (node's built-in runner, no dependencies)
    dir: .
    cmds:
      - node --test js/*.test.js {{.CLI_ARGS}}

  test:all:
    desc: Run every suite (each in its own session — extras have separate settings)
    dir: .
    deps: [install]
    cmds:
      - poetry run pytest labb
      - poetry run pytest -c docs/pytest.ini docs
      - poetry run pytest extras/icons
      - poetry run pytest extras/start
      - cd extras/blocks && poetry run pytest
      - node --test js/*.test.js


  lb-schema:generate:
    desc: Generate lb-schema.js from component YAML schemas
    dir: .
    deps: [install]
    cmds:
      - poetry run python labb/scripts/generate_lb_schema.py

  llms:generate:
    desc: Generate llms.txt file for LLM documentation
    dir: .
    deps: [install]
    cmds:
      - poetry run python -m labb.llms.generator

  chart:download:
    desc: Download the Chart.js UMD bundle from CDN into labb/static/labb/js/vendor/
    cmds:
      - mkdir -p labb/static/labb/js/vendor
      - curl -fsSL https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js -o labb/static/labb/js/vendor/chart.umd.min.js
      - curl -fsSL https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js.map -o labb/static/labb/js/vendor/chart.umd.min.js.map
      - echo "Downloaded chart.umd.min.js"

  clean:
    desc: Clean up generated files and caches
    cmds:
      - find . -type f -name "*.pyc" -delete
      - find . -type d -name "__pycache__" -delete
      - find . -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true
      - echo "Cleaned up generated files"

  version:
    desc: Update version numbers across all packages (labbcd owns this)
    dir: .
    cmds:
      - labbcd release version {{.CLI_ARGS}}
    summary: |
      Update version numbers across all packages.

      Examples:
        task version -- 0.2.0                    # Update to version 0.2.0
        task version -- 0.2.0 --dry-run         # Preview changes without modifying files

      The script will update versions in:
      - Main project (pyproject.toml, labb/__init__.py)
      - Docs package (docs/pyproject.toml, docs/labbdocs/__init__.py)
      - Icons package (extras/icons/pyproject.toml, extras/icons/labbicons/__init__.py)

      After updating versions:
      1. Review changes: git diff
      2. Commit changes: git add . && git commit -m 'Bump version to X.X.X'
      3. Push to main branch to trigger release

  default:
    desc: Show available tasks
    cmds:
      - task --list
