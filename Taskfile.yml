version: '3'

tasks:
  install:
    desc: Install main project dependencies
    dir: .
    cmds:
      - poetry install --with dev
    sources:
      - pyproject.toml
      - poetry.lock
    generates:
      - poetry.lock

  update:
    desc: Update dependencies in labb and all sub-packages
    dir: .
    cmds:
      - poetry update --with dev
      - cd docs && poetry update
      - cd extras/icons && poetry update
      - cd extras/start && poetry update

  venv:
    desc: Show poetry virtual environment activation instructions
    cmds:
      - echo "To activate the virtual environment, run:"
      - echo "eval \"\$(poetry env activate)\""

  lint:
    desc: Run linting for the project
    dir: .
    deps: [install]
    cmds:
      - poetry run ruff format
      - poetry run ruff check --select I --fix

  check:
    desc: Run checking for the project
    dir: .
    deps: [install]
    cmds:
      - poetry run pre-commit run --all-files

  test:icons:
    desc: Run tests for the icons project (parallel execution enabled)
    dir: .
    deps: [install]
    cmds:
      - poetry run pytest extras/icons {{.CLI_ARGS}}

  test:
    desc: Run tests for the main project (parallel execution enabled)
    dir: .
    deps: [install]
    cmds:
      - poetry run pytest {{.CLI_ARGS}}
    summary: |
      Run tests for the main project with parallel execution.

      Parallel execution is enabled by default (uses all CPU cores).

      Examples:
        task test                           # Run all tests in parallel (auto-detect CPUs)
        task test -- -n 4                   # Run with 4 workers
        task test -- -n 0                   # Disable parallel execution
        task test -- -k test_button         # Run specific test (with parallelism)
        task test -- labb/tests/cli         # Run specific directory

  llms:generate:
    desc: Generate llms.txt file for LLM documentation
    dir: .
    deps: [install]
    cmds:
      - poetry run python -m labb.llms.generator

  alpine:generate:
    desc: Generate Alpine.js component JS files from component schemas
    dir: .
    deps: [install]
    cmds:
      - poetry run python -m labb.components.generators.alpine_components {{.CLI_ARGS}}
      - poetry run python -m labb.components.generators.alpine_x_templates
    summary: |
      Generate Alpine.js component files into labb/static/labb/js/alpine/.

      Examples:
        task alpine:generate                          # Generate all components
        task alpine:generate -- button               # Generate specific component(s)
        task alpine:generate -- button modal badge   # Generate multiple components

  alpine:download:
    desc: Download the Alpine.js minified bundle from CDN into labb/static/labb/js/alpine/
    cmds:
      - mkdir -p labb/static/labb/js/alpine
      - curl -fsSL https://cdn.jsdelivr.net/npm/alpinejs/dist/cdn.min.js -o labb/static/labb/js/alpine/alpine.min.js
      - echo "Downloaded alpine.min.js"

  chart:download:
    desc: Download the Chart.js UMD bundle from CDN into labb/static/labb/js/chart/
    cmds:
      - mkdir -p labb/static/labb/js/chart
      - curl -fsSL https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js -o labb/static/labb/js/chart/chart.umd.min.js
      - curl -fsSL https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js.map -o labb/static/labb/js/chart/chart.umd.min.js.map
      - echo "Downloaded chart.umd.min.js"

  clean:
    desc: Clean up generated files and caches
    cmds:
      - find . -type f -name "*.pyc" -delete
      - find . -type d -name "__pycache__" -delete
      - find . -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true
      - echo "Cleaned up generated files"

  version:
    desc: Update version numbers across all packages
    dir: .
    cmds:
      - poetry run python scripts/version_manager.py {{.CLI_ARGS}}
    summary: |
      Update version numbers across all packages.

      Examples:
        task version -- 0.2.0                    # Update to version 0.2.0
        task version -- 0.2.0 --dry-run         # Preview changes without modifying files

      The script will update versions in:
      - Main project (pyproject.toml, labb/__init__.py)
      - Docs package (docs/pyproject.toml, docs/labbdocs/__init__.py)
      - Icons package (extras/icons/pyproject.toml, extras/icons/labbicons/__init__.py)

      After updating versions:
      1. Review changes: git diff
      2. Commit changes: git add . && git commit -m 'Bump version to X.X.X'
      3. Push to main branch to trigger release

  default:
    desc: Show available tasks
    cmds:
      - task --list
