{% load lb_tags lbr_tags %}
<c-vars content="" />
{% parse_icon attrs as i %}
{% lbr_props "steps.item" attrs=attrs as rx %}

<li class="{{ rx.classes }}" {% if content %}data-content="{{ content }}"{% endif %} {{ rx.attrs }}>
    {% if i.name %}
        <span class="step-icon"><c-component is="lbi" n="{{ i.name }}" w="1em" h="1em" :fill=i.fill class="{{ i.css_class }}" /></span>
    {% endif %}
    {{ slot }}
</li>
