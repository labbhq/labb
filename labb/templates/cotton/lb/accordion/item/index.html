{% load lbr_tags %}
<c-vars
    name=""
    checked
    title=""
/>
{% lbr_props "accordion.item" attrs=attrs as rx %}

<div class="{{ rx.classes }}" {{ rx.attrs }}>
    <input type="radio" name="{{ name }}" {% if checked %}checked{% endif %} />
    {% if title %}
        <div class="collapse-title font-semibold">{{ title }}</div>
    {% else %}
        {{ titleSlot }}
    {% endif %}
    <div class="collapse-content">
        {{ slot }}
    </div>
</div>
