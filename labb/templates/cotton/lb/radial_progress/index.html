{% load lbr_tags %}
<c-vars
    value="0"
    progressSize=""
    thickness=""
/>

{% lbr_props "radial-progress" attrs=attrs as rx %}
{% lbr_style_vars value=value size=progressSize thickness=thickness as sv %}
{% lbr_reactive_attr "aria-valuenow" value as av %}

<div class="{{ rx.classes }}" style="{{ sv.style }}" {{ sv.attrs }} role="progressbar" aria-valuenow="{{ av.text }}" {{ av.attrs }} {{ rx.attrs }}>
    {{ slot }}
</div>
