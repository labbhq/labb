{% load lb_tags lbr_tags %}
{% parse_icon attrs as i %}
{% lbr_props "alert" attrs=attrs as rx %}

<div role="alert" class="{{ rx.classes }}" {{ rx.attrs }}>
    {% if i.name %}
        <c-component is="lbi" n="{{ i.name }}" w="1em" h="1em" :fill=i.fill class="text-lg {{ i.css_class }}" />
    {% endif %}

    {{ slot }}

    {% if actions %}
        <div>
            {{ actions }}
        </div>
    {% endif %}
</div>
