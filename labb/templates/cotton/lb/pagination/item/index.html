{% load lb_tags lbr_tags %}
{% parse_icon attrs as i %}
{% lbr_props "pagination.item" attrs=attrs as rx %}

<button class="{{ rx.classes }}" {{ rx.attrs }}>
    {% if i.name and not i.end %}
        <c-component is="lbi" n="{{ i.name }}" w="1em" h="1em" :fill=i.fill class="{{ i.css_class }}" />
    {% endif %}
    {{ slot }}
    {% if i.name and i.end %}
        <c-component is="lbi" n="{{ i.name }}" w="1em" h="1em" :fill=i.fill class="{{ i.css_class }}" />
    {% endif %}
</button>
