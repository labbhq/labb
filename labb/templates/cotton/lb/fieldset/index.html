{% load lbr_tags %}
<c-vars legend="" />
{% lbr_props "fieldset" attrs=attrs as rx %}
<fieldset class="{{ rx.classes }}" {{ rx.attrs }}>
    {% if legendSlot %}
        {{ legendSlot }}
    {% elif legend %}
        <legend class="fieldset-legend">{{ legend }}</legend>
    {% endif %}
    {{ slot }}
</fieldset>
