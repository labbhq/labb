{% load lbr_tags %}
<c-vars
    checked
    disabled
    bind=""
/>
{% lbr_props "toggle" attrs=attrs as rx %}

<input
    type="checkbox"
    class="{{ rx.classes }}"
    {% if checked %}checked{% endif %}
    {% if disabled %}disabled{% endif %}
    {% if bind %}data-bind:{{ bind|lbr_bind_path }}{% endif %}
    {{ rx.attrs }}
/>
