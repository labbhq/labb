{% load lb_tags %}
<c-vars
    class=""
    src=""
    alt="Avatar"
    size="md"
    :sizeClasses="{
        'sm': 'w-8',
        'md': 'w-10',
        'lg': 'w-12'
    }"
/>

<div
    class="chat-image avatar {{ class }}"
    {{ attrs }}
>
    <div class="{{ sizeClasses|get_dict_item:size }} rounded-full">
        {% if src %}
            <img src="{{ src }}" alt="{{ alt }}" />
        {% else %}
            {{ slot }}
        {% endif %}
    </div>
</div>
