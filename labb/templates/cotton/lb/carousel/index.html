{% load lb_tags %}
<c-vars
    class=""
    snap="start"
    direction="horizontal"
    :snapClasses="{
        'start': 'carousel-start',
        'center': 'carousel-center',
        'end': 'carousel-end'
    }"
    :directionClasses="{
        'horizontal': '',
        'vertical': 'carousel-vertical'
    }"
/>

<div
    class="carousel {{ snapClasses|get_dict_item:snap }} {{ directionClasses|get_dict_item:direction }} {{ class }}"
    {{ attrs }}
>
    {{ slot }}
</div>
