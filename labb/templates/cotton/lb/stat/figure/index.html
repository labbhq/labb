{% load lb_tags lbr_tags %}
{% parse_icon attrs as i %}
{% lbr_props "stat.figure" attrs=attrs as rx %}

<div class="{{ rx.classes }}" {{ rx.attrs }}>
    {% if i.name %}
        <c-component is="lbi" n="{{ i.name }}" w="1.5em" h="1.5em" :fill=i.fill class="{{ i.css_class }}" />
    {% endif %}
    {{ slot }}
</div>
