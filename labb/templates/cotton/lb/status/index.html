{% load lbr_tags %}
<c-vars animate="" />
{% lbr_props "status" attrs=attrs animate=animate as rx %}
{% lbr_props "status" attrs=attrs animate="" as rx_base %}

{% if animate == "ping" %}
<div class="inline-grid *:[grid-area:1/1]">
    <div class="{{ rx.classes }}" {{ rx.attrs }}></div>
    <div class="{{ rx_base.classes }}"></div>
</div>
{% elif animate == "bounce" %}
<div class="{{ rx.classes }}" {{ rx.attrs }}></div>
{% else %}
<div class="{{ rx.classes }}" {{ rx.attrs }}></div>
{% endif %}
