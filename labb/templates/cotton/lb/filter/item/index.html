{% load lbr_tags %}
<c-vars type="radio" name="filter" label="" />
{% lbr_props "filter.item" attrs=attrs as rx %}
{% if type == "reset" %}
<input class="{{ rx.classes }} btn-square" type="reset" value="&times;" {{ rx.attrs }} />
{% else %}
<input class="{{ rx.classes }}" type="{{ type }}" name="{{ name }}" aria-label="{{ label }}" {{ rx.attrs }} />
{% endif %}
