<c-vars
    class=""
    name="filter"
    label=""
    type="radio"
    reset
/>

{% if type == "reset" %}
<input class="btn btn-square {{ class }}" type="reset" value="&times;" {{ attrs }} />
{% else %}
<input class="btn {% if reset %}filter-reset{% endif %} {{ class }}" type="{{ type }}" name="{{ name }}" aria-label="{{ label }}" {{ attrs }} />
{% endif %}
