{% load lb_tags %}
<c-vars
    class=""
/>
{% parse_icon attrs as i %}

<div class="timeline-middle {{ class }}" {{ attrs|strip_icon_attrs }}>
    {% if i.name %}
        <c-component is="lbi" n="{{ i.name }}" w="1.25em" h="1.25em" :fill=i.fill class="{{ i.css_class }}" />
    {% endif %}
    {{ slot }}
</div>
