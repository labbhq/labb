{% load lb_tags %}
<c-vars
    class=""
    direction=""
    :directionClasses="{
        'horizontal': 'timeline-horizontal',
        'vertical': 'timeline-vertical'
    }"
    compact
    snap
/>

<ul class="timeline {{ directionClasses|get_dict_item:direction }} {% if compact %}timeline-compact{% endif %} {% if snap %}timeline-snap-icon{% endif %} {{ class }}" {{ attrs }}>
    {{ slot }}
</ul>
