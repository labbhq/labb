{% load lb_tags %}
<c-vars
    class=""
    variant=""
    :variantClasses="{
        'neutral': 'range-neutral',
        'primary': 'range-primary',
        'secondary': 'range-secondary',
        'accent': 'range-accent',
        'info': 'range-info',
        'success': 'range-success',
        'warning': 'range-warning',
        'error': 'range-error'
    }"
    size="md"
    :sizeClasses="{
        'xs': 'range-xs',
        'sm': 'range-sm',
        'md': 'range-md',
        'lg': 'range-lg',
        'xl': 'range-xl'
    }"
    validate
/>

<input
    type="range"
    class="range {{ variantClasses|get_dict_item:variant }} {{ sizeClasses|get_dict_item:size }} {% if validate %}validator{% endif %} {{ class }}"
    {{ attrs }}
/>
