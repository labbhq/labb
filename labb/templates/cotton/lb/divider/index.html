{% load lb_tags %}
<c-vars
    class=""
    variant=""
    :variantClasses="{
        'neutral': 'divider-neutral',
        'primary': 'divider-primary',
        'secondary': 'divider-secondary',
        'accent': 'divider-accent',
        'info': 'divider-info',
        'success': 'divider-success',
        'warning': 'divider-warning',
        'error': 'divider-error'
    }"
    direction=""
    :directionClasses="{
        'horizontal': 'divider-horizontal',
        'vertical': 'divider-vertical'
    }"
    position=""
    :positionClasses="{
        'start': 'divider-start',
        'end': 'divider-end'
    }"
/>

<div class="divider {{ variantClasses|get_dict_item:variant }} {{ directionClasses|get_dict_item:direction }} {{ positionClasses|get_dict_item:position }} {{ class }}" {{ attrs }}>{{ slot }}</div>
