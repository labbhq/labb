{% load lbr_tags %}
<c-vars title="" open />
{% lbr_props "collapse" attrs=attrs open=open as rx %}

<div class="{{ rx.classes }}" {{ rx.attrs }}>
    <input type="checkbox" {% if open %}checked{% endif %} />
    {% if title %}
        <div class="collapse-title font-semibold">{{ title }}</div>
    {% else %}
        {{ titleSlot }}
    {% endif %}
    <div class="collapse-content">
        {{ slot }}
    </div>
</div>
