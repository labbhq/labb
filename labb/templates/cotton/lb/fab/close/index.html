{% load lbr_tags %}
<c-vars
    class=""
    variant="error"
    size="lg"
/>
{% lbr_props "button" attrs=attrs variant=variant size=size as btn %}

<div class="fab-close {{ class }}" {{ attrs }}>
    <span class="btn-circle {{ btn.classes }}">
        {% if slot %}
            {{ slot }}
        {% else %}
            ✕
        {% endif %}
    </span>
</div>
