<c-lbr.signals $save.variant="primary" $save.label="Save changes" />

<div class="w-full md:w-96">
    <c-lb.button
        variant="$save.variant:primary"
        class="w-full"
        data-on:click="$save.variant = 'info'; $save.label = 'Saving…';
            setTimeout(() => { $save.variant = 'success'; $save.label = 'Saved'; }, 2000);
            setTimeout(() => { $save.variant = 'primary'; $save.label = 'Save changes'; }, 3000)"
    >
        <span data-text="$save.label"></span>
    </c-lb.button>
</div>
