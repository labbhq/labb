<div x-data="{ btnProps: { variant: '', size: 'md', btnStyle: '' } }" class="flex flex-col gap-6 items-start w-full md:w-96">

    <c-lb.button.x x-model="btnProps" size="md">
        Click me — <span x-text="btnProps.variant || 'default'"></span>
    </c-lb.button.x>

    <c-lb.label floating class="w-full">
        <span>Variant</span>
        <select x-model="btnProps.variant" class="select select-sm">
            <option value="">Default</option>
            <option value="primary">Primary</option>
            <option value="secondary">Secondary</option>
            <option value="accent">Accent</option>
            <option value="success">Success</option>
            <option value="warning">Warning</option>
            <option value="error">Error</option>
        </select>
    </c-lb.label>

    <c-lb.label floating class="w-full">
        <span>Size</span>
        <select x-model="btnProps.size" class="select select-sm">
            <option value="xs">xs</option>
            <option value="sm">sm</option>
            <option value="md">md</option>
            <option value="lg">lg</option>
            <option value="xl">xl</option>
        </select>
    </c-lb.label>

    <c-lb.label floating class="w-full">
        <span>Style</span>
        <select x-model="btnProps.btnStyle" class="select select-sm">
            <option value="">Default</option>
            <option value="outline">Outline</option>
            <option value="soft">Soft</option>
            <option value="ghost">Ghost</option>
            <option value="link">Link</option>
        </select>
    </c-lb.label>

</div>
