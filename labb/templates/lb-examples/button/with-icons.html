<div class="flex flex-wrap gap-4 items-center">
    <!-- icon="name" — line icon at start -->
    <c-lb.button icon="rmx.home">
        Home
    </c-lb.button>

    <!-- icon.fill="name" — filled icon at start -->
    <c-lb.button icon.fill="rmx.heart" variant="error">
        Like
    </c-lb.button>

    <!-- icon.end="name" — line icon at end -->
    <c-lb.button icon.end="rmx.arrow-right" variant="primary">
        Continue
    </c-lb.button>

    <!-- icon.fill.end="name" — filled icon at end -->
    <c-lb.button icon.fill.end="rmx.arrow-right" variant="success">
        Submit
    </c-lb.button>

    <!-- icon.end.fill="name" — same as above, order doesn't matter -->
    <c-lb.button icon.end.fill="rmx.check" variant="accent">
        Done
    </c-lb.button>

    <!-- icon.class="..." — custom classes on the icon -->
    <c-lb.button icon.fill="rmx.star" icon.class="text-warning">
        Favorite
    </c-lb.button>

    <!-- Icon only buttons -->
    <c-lb.button modifier="square" icon="rmx.menu-4" variant="primary">
    </c-lb.button>

    <c-lb.button modifier="circle" icon.fill="rmx.add" variant="accent">
    </c-lb.button>
</div>
