<div class="w-full mx-auto">
    <c-lb.card border>
        <c-lb.card.body>
            <div class="flex items-center justify-between">
                <c-lb.card.title>Today</c-lb.card.title>
                <c-lb.badge variant="primary" size="sm">2 open</c-lb.badge>
            </div>

            <c-lb.list>
                <c-lb.list.row>
                    <c-lbi n="rmx.checkbox-circle" w="18" h="18" class="text-success shrink-0" />
                    <span class="line-through text-base-content/40">Install labb</span>
                </c-lb.list.row>
                <c-lb.list.row>
                    <c-lbi n="rmx.checkbox-blank-circle" w="18" h="18" class="text-base-content/30 shrink-0" />
                    <span>Write a view</span>
                </c-lb.list.row>
                <c-lb.list.row>
                    <c-lbi n="rmx.checkbox-blank-circle" w="18" h="18" class="text-base-content/30 shrink-0" />
                    <span>Render a page</span>
                </c-lb.list.row>
            </c-lb.list>

            <c-lb.card.actions>
                <c-lb.button variant="primary" size="sm" icon="rmx.add">Add task</c-lb.button>
            </c-lb.card.actions>
        </c-lb.card.body>
    </c-lb.card>
</div>
