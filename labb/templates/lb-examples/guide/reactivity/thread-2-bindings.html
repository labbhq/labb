<c-lbr.signals $filters.q="" $status="idle" />

<div class="flex flex-col gap-3 w-full max-w-sm">
    <c-lb.input
        type="search"
        bind="$filters.q"
        placeholder="Search customers"
        data-on:input="$status = $filters.q ? 'searching' : 'idle'"
    />

    <div class="rounded-lg bg-base-200/50 p-3 font-mono text-xs">
        filters.q = "<span data-text="$filters.q"></span>"<br>
        status = "<span data-text="$status"></span>"
    </div>

    <c-lb.button
        btnStyle="ghost"
        size="sm"
        class="self-start"
        data-show="$filters.q"
        data-on:click="$filters.q = ''; $status = 'idle'"
    >Clear</c-lb.button>
</div>
