<div class="flex flex-col gap-4 w-full max-w-sm">
    <div class="flex items-center gap-3">
        <c-lb.toggle class="theme-controller" value="dark" size="sm" title="Toggle dark mode" />
        <span class="text-sm text-base-content/70">Switch to dark mode</span>
    </div>

    <c-lb.card border>
        <c-lb.card.body>
            <c-lb.card.title>Themed surface</c-lb.card.title>
            <p class="text-sm text-base-content/60">
                Every colour here comes from the theme, so this card follows the toggle.
            </p>
            <c-lb.card.actions>
                <c-lb.button variant="primary" size="sm">Primary</c-lb.button>
                <c-lb.button btnStyle="ghost" size="sm">Ghost</c-lb.button>
            </c-lb.card.actions>
        </c-lb.card.body>
    </c-lb.card>
</div>
