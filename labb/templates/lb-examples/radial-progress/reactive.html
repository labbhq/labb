<c-lbr.signals $upload.pct="35" />

<div class="flex flex-col items-start gap-4 w-full md:w-96">

    <c-lb.radial-progress value="$upload.pct:35" variant="primary" progressSize="6rem">
        <span data-text="$upload.pct + '%'">35%</span>
    </c-lb.radial-progress>

    <c-lb.range bind="upload.pct" min="0" max="100" variant="primary" class="w-full" />

</div>
