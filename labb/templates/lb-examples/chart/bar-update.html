<script>
    function randomizeChart(chart, min, max) {
        const rand = () => Math.floor(Math.random() * (max - min)) + min;
        return {
            data: {
                labels: chart.data.labels,
                datasets: chart.data.datasets.map(ds => ({ ...ds, data: ds.data.map(rand) })),
            },
        };
    }
</script>

<c-lbr.signals :$chartData="{
    'data': {
        'labels': ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
        'datasets': [
            {'label': 'Revenue', 'data': [4200, 3800, 5100, 4700, 6200, 5800]},
            {'label': 'Expenses', 'data': [2100, 2400, 2800, 2200, 3100, 2700]},
        ],
    }
}" />

<div class="flex flex-col gap-3">
    <div class="flex justify-end">
        <c-lb.button
            size="sm"
            variant="primary"
            icon="rmx.shuffle"
            data-on:click="$chartData = randomizeChart($chartData, 500, 8500)"
        >
            Randomize data
        </c-lb.button>
    </div>

    <c-lb.chart.bar data="$chartData" />
</div>
