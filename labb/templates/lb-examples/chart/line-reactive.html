<div x-data="{
    periods: {
        week: {
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [
                    { label: 'Users',    data: [120, 180,  95, 210, 170, 230, 160] },
                    { label: 'Sessions', data: [200, 310, 150, 390, 280, 420, 290] }
                ]
            }
        },
        month: {
            data: {
                labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                datasets: [
                    { label: 'Users',    data: [870, 1020, 940, 1180] },
                    { label: 'Sessions', data: [1540, 1830, 1650, 2100] }
                ]
            }
        }
    },
    view: 'week',
    get chartConfig() { return this.periods[this.view]; }
}">
    <div class="flex gap-2 mb-4">
        <c-lb.button size="sm" :btnStyle="view === 'week'  ? 'primary' : 'ghost'" @click="view = 'week'">Weekly</c-lb.button>
        <c-lb.button size="sm" :btnStyle="view === 'month' ? 'primary' : 'ghost'" @click="view = 'month'">Monthly</c-lb.button>
    </div>
    <c-lb.chart.line legend="bottom" x-model="chartConfig" />
</div>
