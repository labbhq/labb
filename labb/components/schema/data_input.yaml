        default: ''
        description: Additional CSS classes to apply
        required: false
      as:
        type: enum
        values:
        - div
        - form
        default: div
        description: HTML element to render as (form enables reset button)
      multiSelect:
        type: boolean
        default: false
        description: Enable multi-select mode (removes filter class so multiple items can be selected)
    slots:
      default:
        description: Filter items (radio/checkbox inputs with btn class)

  filter.item:
