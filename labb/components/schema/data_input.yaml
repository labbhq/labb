        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      name:
        type: string
        default: filter
        description: Radio group name
        required: false
      label:
        type: string
        default: ''
        description: Visible label text for the filter button (sets aria-label)
        required: true
      type:
        type: enum
        values:
        - radio
        - checkbox
        - reset
        default: radio
        description: Input type
      reset:
        type: boolean
        default: false
        description: Mark as the reset/clear-all button
