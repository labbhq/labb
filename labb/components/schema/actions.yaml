# Component Schema Documentation
#
# Each component can have:
# - base_classes: CSS classes that are always applied when the component renders
# - optional_base_classes: CSS classes that are conditionally applied based on component state/slots
#   These classes are not required to be present in all renderings and won't cause test failures
#
components:
  button:
    template: lb/button/index.html
    description: Button component with different styles and sizes
    base_classes:
    - btn
    optional_base_classes:
    - btn
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      as:
        type: enum
        values:
        - button
        - a
        - input
        - div
        default: button
        description: HTML tag to use for the button element
      variant:
        type: enum
        values:
        - ''
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
        default: ''
        description: Button color variant
        css_mapping:
          neutral: btn-neutral
          primary: btn-primary
          secondary: btn-secondary
          accent: btn-accent
          info: btn-info
          success: btn-success
          warning: btn-warning
          error: btn-error
      btnStyle:
        type: enum
        values:
        - ''
        - outline
        - dash
        - soft
        - ghost
        - link
        - bare
        default: ''
        description: Button style variant. Use "bare" for a plain button with no btn classes.
        css_mapping:
          outline: btn-outline
          dash: btn-dash
          soft: btn-soft
          ghost: btn-ghost
          link: btn-link
      behavior:
        type: enum
        values:
        - ''
        - active
        - disabled
        default: ''
        description: Button behavior state
        css_mapping:
          active: btn-active
          disabled: btn-disabled
      size:
        type: enum
        values:
        - xs
        - sm
        - md
        - lg
        - xl
        default: md
        description: Button size
        css_mapping:
          xs: btn-xs
          sm: btn-sm
          md: btn-md
          lg: btn-lg
          xl: btn-xl
      modifier:
        type: enum
        values:
        - ''
        - wide
        - block
        - square
        - circle
        default: ''
        description: Button layout modifier
        css_mapping:
          wide: btn-wide
          block: btn-block
          square: btn-square
          circle: btn-circle
      icon:
        type: string
        default: ''
        description: Icon name to display
        required: false
        dot_modifiers:
          fill: Render in filled (solid) style
          end: Place at the end of the text
          # Modifiers combine in the attribute name: icon.fill.end="name"
      icon.class:
        type: string
        default: ''
        description: Additional CSS classes for the icon
        required: false

  modal:
    template: lb/modal/index.html
    description: Modal dialog component using HTML dialog element for better accessibility
    base_classes:
    - modal
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      id:
        type: string
        default: ''
        description: Unique ID for the modal dialog (required for showModal/close methods)
        required: true
      placement:
        type: enum
        values:
        - ''
        - top
        - middle
        - bottom
        - start
        - end
        default: middle
        description: Modal position on screen
        css_mapping:
          top: modal-top
          middle: modal-middle
          bottom: modal-bottom
          start: modal-start
          end: modal-end
      open:
        type: boolean
        default: false
        description: Whether modal is initially open
        css_mapping:
          true: modal-open
      size:
        type: map
        variable: modal.box:size
        description: Modal box size (for default box)
      boxClass:
        type: string
        default: ''
        description: Additional CSS classes to apply to the default modal box
        required: false
      withBackdrop:
        type: map
        variable: modal.backdrop
        description: Add a backdrop overlay for closing when clicked outside
      withCloseBtn:
        type: map
        variable: modal.close
        description: Add a close button to the modal
      closeBtnPosition:
        type: map
        variable: modal.close:position
        description: Position of the close button
    slots:
      default:
        description: Modal content (automatically wrapped in modal.box)
      box:
        description: Custom modal box content (overrides default slot)

  modal.box:
    template: lb/modal/box/index.html
    description: Main content container for the modal
    base_classes:
    - modal-box
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      size:
        type: enum
        values:
        - ''
        - xs
        - sm
        - md
        - lg
        - xl
        - screen
        default: ''
        description: Modal box size
        css_mapping:
          xs: w-11/12 sm:w-72 max-w-xs
          sm: w-11/12 sm:w-80 max-w-sm
          md: w-11/12 sm:w-96 max-w-md
          lg: w-11/12 sm:w-[32rem] max-w-lg
          xl: w-11/12 sm:w-[36rem] max-w-xl
          screen: w-11/12 max-w-5xl

  modal.action:
    template: lb/modal/action.html
    description: Container for modal action buttons
    base_classes:
    - modal-action
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false

  modal.backdrop:
    template: lb/modal/backdrop.html
    description: Backdrop overlay for closing modal when clicked outside
    base_classes:
    - modal-backdrop
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false

  modal.close:
    template: lb/modal/close/index.html
    description: Close button for modal
    base_classes:
    - btn
    - btn-sm
    - btn-circle
    - btn-ghost
    optional_base_classes:
    - absolute
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      variant:
        type: enum
        values:
        - ''
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
        default: ''
        description: Button color variant
        css_mapping:
          neutral: btn-neutral
          primary: btn-primary
          secondary: btn-secondary
          accent: btn-accent
          info: btn-info
          success: btn-success
          warning: btn-warning
          error: btn-error
      position:
        type: enum
        values:
        - ''
        - top-right
        - top-left
        - bottom-right
        - bottom-left
        default: top-right
        description: Position of the close button
        css_mapping:
          top-right: right-2 top-2
          top-left: left-2 top-2
          bottom-right: right-2 bottom-2
          bottom-left: left-2 bottom-2

  dropdown:
    template: lb/dropdown/index.html
    description: Dropdown component that shows content when focused or clicked
    base_classes:
    - dropdown
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      placement:
        type: enum
        values:
        - bottom
        - top
        - left
        - right
        default: bottom
        description: Dropdown placement relative to trigger
        css_mapping:
          top: dropdown-top
          left: dropdown-left
          right: dropdown-right
      alignment:
        type: enum
        values:
        - start
        - center
        - end
        default: ''
        description: Horizontal alignment of dropdown content
        css_mapping:
          start: dropdown-start
          center: dropdown-center
          end: dropdown-end
      hover:
        type: boolean
        default: false
        description: Enable hover activation instead of focus
        css_mapping:
          true: dropdown-hover
      open:
        type: boolean
        default: false
        description: Force dropdown to be open
        css_mapping:
          true: dropdown-open
    slots:
      default:
        description: Dropdown content using dropdown.trigger and dropdown.content components

  dropdown.trigger:
    template: lb/dropdown/trigger.html
    description: Dropdown trigger button that controls the dropdown visibility
    base_classes: []
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      as:
        type: enum
        values:
        - div
        - button
        - label
        default: div
        description: HTML element to render as

  dropdown.content:
    template: lb/dropdown/content.html
    description: Dropdown content container that appears when dropdown is active
    base_classes:
    - dropdown-content
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false

  swap:
    template: lb/swap/index.html
    description: Swap component for toggling between two elements with smooth transitions
    base_classes:
    - swap
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      effect:
        type: enum
        values:
        - ''
        - rotate
        - flip
        default: ''
        description: Animation effect for the swap transition
        css_mapping:
          rotate: swap-rotate
          flip: swap-flip
      checked:
        type: boolean
        default: false
        description: Whether the checkbox is initially checked
      disabled:
        type: boolean
        default: false
        description: Whether the swap is disabled
      inputClass:
        type: string
        default: ''
        description: CSS classes to apply to the checkbox input element
        required: false
      name:
        type: string
        default: ''
        description: Name attribute for the checkbox input
        required: false
      value:
        type: string
        default: ''
        description: Value attribute for the checkbox input
        required: false

  swap.on:
    template: lb/swap/on.html
    description: Content shown when swap is active
    base_classes:
    - swap-on
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      icon:
        type: string
        default: ''
        description: Icon name to display
        required: false
        dot_modifiers:
          fill: Render in filled (solid) style
      icon.class:
        type: string
        default: ''
        description: Additional CSS classes for the icon
        required: false

  swap.off:
    template: lb/swap/off.html
    description: Content shown when swap is inactive
    base_classes:
    - swap-off
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      icon:
        type: string
        default: ''
        description: Icon name to display
        required: false
        dot_modifiers:
          fill: Render in filled (solid) style
      icon.class:
        type: string
        default: ''
        description: Additional CSS classes for the icon
        required: false

  swap.indeterminate:
    template: lb/swap/indeterminate.html
    description: Content shown when checkbox is in indeterminate state
    base_classes:
    - swap-indeterminate
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      icon:
        type: string
        default: ''
        description: Icon name to display
        required: false
        dot_modifiers:
          fill: Render in filled (solid) style
      icon.class:
        type: string
        default: ''
        description: Additional CSS classes for the icon
        required: false

  fab:
    template: lb/fab/index.html
    description: FAB (Floating Action Button) with Speed Dial functionality
    base_classes:
    - fab
    slots:
      default:
        description: Speed dial action buttons (main slot content)
      label:
        description: Custom HTML content for the main button label (goes inside the existing button div - for rich text, icons,
          etc.)
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      variant:
        type: enum
        values:
        - ''
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
        default: ''
        description: FAB color variant
        css_mapping:
          neutral: btn-neutral
          primary: btn-primary
          secondary: btn-secondary
          accent: btn-accent
          info: btn-info
          success: btn-success
          warning: btn-warning
          error: btn-error
      size:
        type: enum
        values:
        - ''
        - xs
        - sm
        - md
        - lg
        - xl
        default: lg
        description: FAB button size
        css_mapping:
          xs: btn-xs
          sm: btn-sm
          md: btn-md
          lg: btn-lg
          xl: btn-xl
      flower:
        type: boolean
        default: false
        description: Enable flower (quarter circle) arrangement instead of vertical
        css_mapping:
          true: fab-flower
      icon:
        type: string
        default: ''
        description: Icon name to display
        required: false
        dot_modifiers:
          fill: Render in filled (solid) style
      icon.class:
        type: string
        default: ''
        description: Additional CSS classes for the icon
        required: false
      label:
        type: string
        default: ''
        description: Text label for the main button (alternative to icon)
        required: false

  fab.close:
    template: lb/fab/close.html
    description: FAB close button sub-component
    base_classes:
    - fab-close
    slots:
      default:
        description: Custom content for the close button (defaults to ✕ if not provided)
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      variant:
        type: enum
        values:
        - ''
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
        default: error
        description: Close button color variant
        css_mapping:
          neutral: btn-neutral
          primary: btn-primary
          secondary: btn-secondary
          accent: btn-accent
          info: btn-info
          success: btn-success
          warning: btn-warning
          error: btn-error
      size:
        type: enum
        values:
        - ''
        - xs
        - sm
        - md
        - lg
        - xl
        default: lg
        description: Close button size
        css_mapping:
          xs: btn-xs
          sm: btn-sm
          md: btn-md
          lg: btn-lg
          xl: btn-xl

  fab.main-action:
    template: lb/fab/main_action.html
    description: FAB main action button sub-component
    base_classes:
    - fab-main-action
    slots:
      default:
        description: Custom content for the main action button
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      variant:
        type: enum
        values:
        - ''
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
        default: secondary
        description: Main action button color variant
        css_mapping:
          neutral: btn-neutral
          primary: btn-primary
          secondary: btn-secondary
          accent: btn-accent
          info: btn-info
          success: btn-success
          warning: btn-warning
          error: btn-error
      size:
        type: enum
        values:
        - ''
        - xs
        - sm
        - md
        - lg
        - xl
        default: lg
        description: Main action button size
        css_mapping:
          xs: btn-xs
          sm: btn-sm
          md: btn-md
          lg: btn-lg
          xl: btn-xl
