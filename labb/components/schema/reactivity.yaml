# Reactivity component schemas (c-lbr.*)
#
# These are server-driven wire components — they have no CSS base_classes or
# css_mappings. The lb-schema.js generator skips them automatically.
components:
  lbr.get:
    template: lbr/get.html
    description: Fires a GET request on any DOM event. Wraps content in a configurable element with a Datastar data-on or data-init action.
    variables:
      to:
        type: string
        default: ''
        description: 'Django URL name (e.g. "todos:detail") or direct URL (e.g. "/todos/1/"). A leading "/", "http://" or "https://" is treated as a direct URL; everything else is passed to reverse().'
        required: true
      pk:
        type: string
        default: ''
        description: 'Shorthand kwarg — sets {"pk": pk} when kwargs does not already contain "pk". Ignored for direct URLs.'
        required: false
      kwargs:
        type: string
        default: ''
        description: URL kwargs as a JSON string or a dict from context. Ignored for direct URLs.
        required: false
      'on':
        type: string
        default: click
        description: 'Datastar event expression (e.g. "click", "input__debounce.300ms"). Use "init" to fire on page load via data-init instead of data-on:*'
        required: false
      tag:
        type: string
        default: div
        description: HTML element to render
        required: false
      before:
        type: string
        default: ''
        description: Datastar expression to run before the action (e.g. a signal mutation)
        required: false
      options:
        type: string
        default: ''
        description: 'Datastar options object to pass to @get() (e.g. "{openWhenHidden:true}")'
        required: false
      replaceUrl:
        type: boolean
        default: false
        description: Call history.replaceState to the request URL when the action fires
        required: false
      pushUrl:
        type: boolean
        default: false
        description: Call history.pushState to the request URL when the action fires
        required: false
      preserveQuery:
        type: boolean
        default: false
        description: Append location.search to the URL when used with replaceUrl or pushUrl
        required: false
    slots:
      default:
        description: Content rendered inside the wrapper element

  lbr.post:
    template: lbr/post.html
    description: Fires a POST request on any DOM event. Defaults to a form element with submit event and form content-type encoding.
    variables:
      to:
        type: string
        default: ''
        description: 'Django URL name (e.g. "todos:detail") or direct URL (e.g. "/todos/1/"). A leading "/", "http://" or "https://" is treated as a direct URL; everything else is passed to reverse().'
        required: true
      pk:
        type: string
        default: ''
        description: 'Shorthand kwarg — sets {"pk": pk} when kwargs does not already contain "pk". Ignored for direct URLs.'
        required: false
      kwargs:
        type: string
        default: ''
        description: URL kwargs as a JSON string or a dict from context. Ignored for direct URLs.
        required: false
      'on':
        type: string
        default: submit
        description: 'Datastar event expression. Use "init" to fire on page load via data-init instead of data-on:*'
        required: false
      tag:
        type: string
        default: form
        description: 'HTML element to render. When "form", automatically adds {contentType:"form"} unless options= is set'
        required: false
      before:
        type: string
        default: ''
        description: Datastar expression to run before the action
        required: false
      options:
        type: string
        default: ''
        description: 'Datastar options object — overrides the default {contentType:"form"} added for form tags'
        required: false
      noCSRF:
        type: boolean
        default: false
        description: Omit the CSRF token from the request. Only for endpoints that are CSRF-exempt by design (e.g. a cross-origin API); a Django view with CSRF protection will reject the request.
        required: false
    slots:
      default:
        description: Form fields or content rendered inside the wrapper element

  lbr.delete:
    template: lbr/delete.html
    description: Fires a DELETE request on any DOM event, optionally gated behind a confirm() dialog.
    variables:
      to:
        type: string
        default: ''
        description: 'Django URL name (e.g. "todos:detail") or direct URL (e.g. "/todos/1/"). A leading "/", "http://" or "https://" is treated as a direct URL; everything else is passed to reverse().'
        required: true
      pk:
        type: string
        default: ''
        description: 'Shorthand kwarg — sets {"pk": pk} when kwargs does not already contain "pk". Ignored for direct URLs.'
        required: false
      kwargs:
        type: string
        default: ''
        description: URL kwargs as a JSON string or a dict from context. Ignored for direct URLs.
        required: false
      'on':
        type: string
        default: click
        description: 'Datastar event expression. Use "init" to fire on page load via data-init instead of data-on:*'
        required: false
      tag:
        type: string
        default: span
        description: HTML element to render
        required: false
      before:
        type: string
        default: ''
        description: Datastar expression to run before the action
        required: false
      confirm:
        type: string
        default: ''
        description: Confirmation message shown in a browser confirm() dialog — action is skipped if the user cancels
        required: false
      options:
        type: string
        default: ''
        description: 'Datastar options object to pass to @delete()'
        required: false
      noCSRF:
        type: boolean
        default: false
        description: Omit the CSRF token from the request. Only for endpoints that are CSRF-exempt by design (e.g. a cross-origin API); a Django view with CSRF protection will reject the request.
        required: false
    slots:
      default:
        description: Content rendered inside the wrapper element

  lbr.signals:
    template: lbr/signals.html
    description: >-
      Declares Datastar signals and loads Datastar on the page (so a separate
      dependency include is not needed). Provide signals in whichever form fits:
      $-prefixed props for scalars ($open="false"); a Cotton :$-binding or context
      variable for objects and numbers (:$order="{...}"); or a typed :schema
      instance. For an initial value that must be computed in the browser at load
      time (e.g. matchMedia or reading the DOM), pass a raw data-signals="{...}"
      attribute through the component: it is forwarded as-is and evaluated as JS.
      Do not combine $-props and a raw data-signals on the same element.
    variables:
      schema:
        type: string
        default: ''
        description: 'A Signals schema instance — renders data-signals from schema.to_signals_dict(). Takes priority over $-prefixed props.'
        required: false
      syncQuery:
        type: boolean
        default: false
        description: Sync signals to/from the URL query string on init and on every signal change (requires ReactivityMiddleware)
        required: false
    slots:
      default:
        description: Not used — component renders a hidden div only

  lbr.replace-url:
    template: lbr/replace_url.html
    description: Replaces (or pushes) the browser URL on morph without firing a new request. Renders a hidden div with data-init.
    variables:
      to:
        type: string
        default: ''
        description: 'Django URL name (e.g. "todos:detail") or direct URL (e.g. "/todos/1/"). A leading "/", "http://" or "https://" is treated as a direct URL; everything else is passed to reverse().'
        required: true
      pk:
        type: string
        default: ''
        description: 'Shorthand kwarg — sets {"pk": pk} when kwargs does not already contain "pk". Ignored for direct URLs.'
        required: false
      kwargs:
        type: string
        default: ''
        description: URL kwargs as a JSON string or a dict from context. Ignored for direct URLs.
        required: false
      push:
        type: boolean
        default: false
        description: Use history.pushState instead of replaceState. Guards against duplicate history entries.
        required: false

  lbr.target:
    template: lbr/target.html
    description: Marks an element as a named Datastar morph target via data-lbr-target. Use as a stable anchor for partial updates.
    variables:
      name:
        type: string
        default: ''
        description: 'Target name — rendered as data-lbr-target="name"'
        required: true
      tag:
        type: string
        default: div
        description: HTML element to render
        required: false
    slots:
      default:
        description: Content rendered inside the target element
