# Component Schema Documentation
#
# Each component can have:
# - base_classes: CSS classes that are always applied when the component renders
# - optional_base_classes: CSS classes that are conditionally applied based on component state/slots
#   These classes are not required to be present in all renderings and won't cause test failures
#
components:
  table:
    template: lb/table/index.html
    description: DaisyUI Table component with support for zebra, pinning, and sizes.
    base_classes:
    - table
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      size:
        type: enum
        values:
        - xs
        - sm
        - md
        - lg
        - xl
        default: md
        description: Table size
        css_mapping:
          xs: table-xs
          sm: table-sm
          md: table-md
          lg: table-lg
          xl: table-xl
      zebra:
        type: boolean
        default: false
        description: Enable zebra striping
        css_mapping:
          true: table-zebra
      pinRows:
        type: boolean
        default: false
        description: Pin thead/tfoot rows
        css_mapping:
          true: table-pin-rows
      pinCols:
        type: boolean
        default: false
        description: Pin th columns
        css_mapping:
          true: table-pin-cols
    slots:
      default:
        description: Table content using standard HTML table elements (thead, tbody, tr, th, td)

  card:
    template: lb/card/index.html
    description: Main card container component with support for various layouts and styles
    base_classes:
    - card
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      variant:
        type: enum
        values:
        - default
        - primary
        - secondary
        - accent
        - neutral
        - info
        - success
        - warning
        - error
        default: default
        description: Card color variant
        css_mapping:
          primary: bg-primary text-primary-content
          secondary: bg-secondary text-secondary-content
          accent: bg-accent text-accent-content
          neutral: bg-neutral text-neutral-content
          info: bg-info text-info-content
          success: bg-success text-success-content
          warning: bg-warning text-warning-content
          error: bg-error text-error-content
      border:
        type: boolean
        default: false
        description: Add a border to the card
        css_mapping:
          true: card-border
      dash:
        type: boolean
        default: false
        description: Apply a dashed style to the card
        css_mapping:
          true: card-dash
      side:
        type: boolean
        default: false
        description: Position the image in figure to the side of the card
        css_mapping:
          true: card-side
      imageFull:
        type: boolean
        default: false
        description: Make the image in figure element fill the background of the card
        css_mapping:
          true: image-full
      size:
        type: enum
        values:
        - xs
        - sm
        - md
        - lg
        - xl
        default: md
        description: Card size
        css_mapping:
          xs: card-xs
          sm: card-sm
          md: card-md
          lg: card-lg
          xl: card-xl
    slots:
      default:
        description: Card content using card.body, card.title, card.actions, and card.figure components

  card.body:
    template: lb/card/body.html
    description: Main content area of the card
    base_classes:
    - card-body
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false

  card.title:
    template: lb/card/title.html
    description: Title section within the card body
    base_classes:
    - card-title
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      as:
        type: enum
        values:
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6
        - div
        - span
        default: h2
        description: HTML tag to use for the title element

  card.actions:
    template: lb/card/actions.html
    description: Container for action elements (e.g., buttons)
    base_classes:
    - card-actions
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      justify:
        type: enum
        values:
        - start
        - center
        - end
        - between
        - around
        - evenly
        default: ''
        description: Justify content alignment
        css_mapping:
          start: justify-start
          center: justify-center
          end: justify-end
          between: justify-between
          around: justify-around
          evenly: justify-evenly

  card.figure:
    template: lb/card/figure.html
    description: Image container within the card
    base_classes: []
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false

  badge:
    template: lb/badge/index.html
    description: Badge component for displaying status, counts, or labels
    base_classes:
    - badge
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      variant:
        type: enum
        values:
        - ''
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
        default: ''
        description: Badge color variant
        css_mapping:
          neutral: badge-neutral
          primary: badge-primary
          secondary: badge-secondary
          accent: badge-accent
          info: badge-info
          success: badge-success
          warning: badge-warning
          error: badge-error
      style:
        type: enum
        values:
        - ''
        - outline
        - dash
        - soft
        - ghost
        default: ''
        description: Badge style variant
        css_mapping:
          outline: badge-outline
          dash: badge-dash
          soft: badge-soft
          ghost: badge-ghost
      size:
        type: enum
        values:
        - xs
        - sm
        - md
        - lg
        - xl
        default: md
        description: Badge size
        css_mapping:
          xs: badge-xs
          sm: badge-sm
          md: badge-md
          lg: badge-lg
          xl: badge-xl
      icon:
        type: string
        default: ''
        description: Icon name to display
        required: false
        dot_modifiers:
          fill: Render in filled (solid) style
          end: Place at the end of the text
      icon.class:
        type: string
        default: ''
        description: Additional CSS classes for the icon
        required: false

  accordion:
    template: lb/accordion/index.html
    description: Accordion component for displaying collapsible content sections
    base_classes: []
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      join:
        type: boolean
        default: false
        description: Use joined accordion layout with seamless borders
        css_mapping:
          true: join join-vertical
    slots:
      default:
        description: Accordion content using accordion.item components

  accordion.item:
    template: lb/accordion/item.html
    description: Individual accordion item with collapsible content
    base_classes:
    - collapse
    optional_base_classes:
    - collapse-arrow
    - collapse-plus
    - collapse-title
    - collapse-content
    - join-item
    - border
    - border-base-300
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      name:
        type: string
        default: ''
        description: Name for the radio input (should match parent accordion name)
        required: true
      checked:
        type: boolean
        default: false
        description: Whether this accordion item is initially open
        css_mapping:
          true: checked
      title:
        type: string
        default: ''
        description: Title text for the accordion item
        required: false
      style:
        type: enum
        values:
        - ''
        - arrow
        - plus
        default: ''
        description: Accordion item style variant
        css_mapping:
          arrow: collapse-arrow
          plus: collapse-plus
      join:
        type: boolean
        default: false
        description: Use joined accordion item layout
        css_mapping:
          true: join-item
      border:
        type: boolean
        default: false
        description: Add border styling to accordion item
        css_mapping:
          true: border border-base-300
    slots:
      default:
        description: Accordion item content
      titleSlot:
        description: Custom title content (overrides title attribute)

  avatar:
    template: lb/avatar/index.html
    description: Avatar component for displaying user thumbnails or profile pictures
    base_classes:
    - avatar
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      size:
        type: enum
        values:
        - xs
        - sm
        - md
        - lg
        - xl
        default: md
        description: Avatar size
        css_mapping:
          xs: w-8 text-xs
          sm: w-12 text-md
          md: w-16 text-lg
          lg: w-24 text-xl
          xl: w-32 text-2xl
      rounded:
        type: enum
        values:
        - ''
        - xs
        - sm
        - md
        - lg
        - xl
        - full
        default: ''
        description: Avatar border radius size
        css_mapping:
          xs: rounded-xs
          sm: rounded-sm
          md: rounded-md
          lg: rounded-lg
          xl: rounded-xl
          full: rounded-full
      mask:
        type: enum
        values:
        - ''
        - heart
        - squircle
        - hexagon-2
        - triangle
        - pentagon
        - diamond
        - star
        default: ''
        description: Avatar mask shape
        css_mapping:
          heart: mask mask-heart
          squircle: mask mask-squircle
          hexagon-2: mask mask-hexagon-2
          triangle: mask mask-triangle
          pentagon: mask mask-pentagon
          diamond: mask mask-diamond
          star: mask mask-star
      status:
        type: enum
        values:
        - ''
        - online
        - offline
        default: ''
        description: Avatar online/offline status
        css_mapping:
          online: avatar-online
          offline: avatar-offline
      placeholder:
        type: boolean
        default: false
        description: Whether this is a placeholder avatar
        css_mapping:
          true: avatar-placeholder
      ring:
        type: boolean
        default: false
        description: Add a ring around the avatar
        css_mapping:
          true: ring-2 ring-offset-2
      ringColor:
        type: enum
        values:
        - ''
        - primary
        - secondary
        - accent
        - neutral
        - info
        - success
        - warning
        - error
        default: ''
        description: Ring color variant (only applies if ring is true)
        css_mapping:
          primary: ring-primary ring-offset-base-100
          secondary: ring-secondary ring-offset-base-100
          accent: ring-accent ring-offset-base-100
          neutral: ring-neutral ring-offset-base-100
          info: ring-info ring-offset-base-100
          success: ring-success ring-offset-base-100
          warning: ring-warning ring-offset-base-100
          error: ring-error ring-offset-base-100
      src:
        type: string
        default: ''
        description: Image source URL (for image avatars)
        required: false
      alt:
        type: string
        default: Avatar
        description: Alt text for the image
        required: false
      initials:
        type: string
        default: ''
        description: Initials text for placeholder avatars
        required: false
      bgColor:
        type: enum
        values:
        - ''
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
        default: neutral
        description: Background color for placeholder avatars
        css_mapping:
          neutral: bg-neutral text-neutral-content
          primary: bg-primary text-primary-content
          secondary: bg-secondary text-secondary-content
          accent: bg-accent text-accent-content
          info: bg-info text-info-content
          success: bg-success text-success-content
          warning: bg-warning text-warning-content
          error: bg-error text-error-content
      icon:
        type: string
        default: ''
        description: Icon name for placeholder avatars (alternative to initials)
        required: false
        dot_modifiers:
          fill: Render in filled (solid) style
      icon.class:
        type: string
        default: ''
        description: Additional CSS classes for the icon
        required: false
    slots:
      default:
        description: Custom avatar content (overrides automatic image/placeholder rendering)

  avatar.group:
    template: lb/avatar/group.html
    description: Group wrapper for multiple avatars with overlapping layout
    base_classes:
    - avatar-group
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      spacing:
        type: enum
        values:
        - wide
        - normal
        - tight
        - tighter
        - tightest
        default: tight
        description: Spacing between avatars in the group
        css_mapping:
          wide: ''
          normal: -space-x-2
          tight: -space-x-6
          tighter: -space-x-8
          tightest: -space-x-12
    slots:
      default:
        description: Avatar components to display in the group

  diff:
    template: lb/diff/index.html
    description: Image comparison component with draggable resizer for before/after views
    base_classes:
    - diff
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      aspectRatio:
        type: enum
        values:
        - ''
        - 16/9
        - 4/3
        - 1/1
        - 3/4
        - 9/16
        default: ''
        description: Aspect ratio of the diff container
        css_mapping:
          16/9: aspect-[16/9]
          4/3: aspect-[4/3]
          1/1: aspect-square
          3/4: aspect-[3/4]
          9/16: aspect-[9/16]
    slots:
      default:
        description: Diff content using diff.item-1, diff.item-2, and diff.resizer components

  diff.item-1:
    template: lb/diff/item_1.html
    description: First item in the diff comparison (typically the 'before' image)
    base_classes:
    - diff-item-1
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      src:
        type: string
        default: ''
        description: Image source URL
        required: false
      alt:
        type: string
        default: First comparison image
        description: Alt text for the image
        required: false
    slots:
      default:
        description: Custom content (overrides automatic image rendering)

  diff.item-2:
    template: lb/diff/item_2.html
    description: Second item in the diff comparison (typically the 'after' image)
    base_classes:
    - diff-item-2
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      src:
        type: string
        default: ''
        description: Image source URL
        required: false
      alt:
        type: string
        default: Second comparison image
        description: Alt text for the image
        required: false
    slots:
      default:
        description: Custom content (overrides automatic image rendering)

  diff.resizer:
    template: lb/diff/resizer.html
    description: Draggable resizer control for adjusting the comparison view
    base_classes:
    - diff-resizer
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false

  text:
    template: lb/text/index.html
    description: Text component with support for variants, sizes, underline, and icons
    base_classes: []
    optional_base_classes:
    - flex
    - items-center
    - gap-2
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      as:
        type: enum
        values:
        - span
        - p
        - div
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6
        default: span
        description: HTML tag to use for the text element
      variant:
        type: enum
        values:
        - ''
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
        default: ''
        description: Text color variant
        css_mapping:
          neutral: text-neutral
          primary: text-primary
          secondary: text-secondary
          accent: text-accent
          info: text-info
          success: text-success
          warning: text-warning
          error: text-error
      size:
        type: enum
        values:
        - ''
        - xs
        - sm
        - md
        - lg
        - xl
        - 2xl
        - 3xl
        - 4xl
        default: ''
        description: Text size
        css_mapping:
          xs: text-xs
          sm: text-sm
          md: text-base
          lg: text-lg
          xl: text-xl
          2xl: text-2xl
          3xl: text-3xl
          4xl: text-4xl
      underline:
        type: boolean
        default: false
        description: Whether to underline the text
        css_mapping:
          true: underline
      icon:
        type: string
        default: ''
        description: Icon name to display
        required: false
        dot_modifiers:
          fill: Render in filled (solid) style
          end: Place at the end of the text
      icon.class:
        type: string
        default: ''
        description: Additional CSS classes for the icon
        required: false
    slots:
      default:
        description: Text content

  carousel:
    template: lb/carousel/index.html
    description: Carousel component for displaying scrollable content with snap behavior
    base_classes:
    - carousel
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      snap:
        type: enum
        values:
        - start
        - center
        - end
        default: start
        description: Snap position for carousel items
        css_mapping:
          start: carousel-start
          center: carousel-center
          end: carousel-end
      direction:
        type: enum
        values:
        - horizontal
        - vertical
        default: horizontal
        description: Carousel scroll direction
        css_mapping:
          horizontal: ''
          vertical: carousel-vertical
    slots:
      default:
        description: Carousel content using carousel.item components

  carousel.item:
    template: lb/carousel/item.html
    description: Individual carousel item container
    base_classes:
    - carousel-item
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      id:
        type: string
        default: ''
        description: Unique ID for anchor-based navigation
        required: false

  chat:
    template: lb/chat/index.html
    description: Chat container for a single message in a conversation thread
    base_classes:
    - chat
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      placement:
        type: enum
        values:
        - start
        - end
        default: start
        description: Horizontal placement of the chat message
        css_mapping:
          start: chat-start
          end: chat-end
    slots:
      default:
        description: Chat content using chat.image, chat.header, chat.bubble, and chat.footer components

  chat.bubble:
    template: lb/chat/bubble/index.html
    description: Message bubble that displays the chat message text
    base_classes:
    - chat-bubble
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      variant:
        type: enum
        values:
        - ''
        - primary
        - secondary
        - accent
        - neutral
        - info
        - success
        - warning
        - error
        default: ''
        description: Bubble color variant
        css_mapping:
          primary: chat-bubble-primary
          secondary: chat-bubble-secondary
          accent: chat-bubble-accent
          neutral: chat-bubble-neutral
          info: chat-bubble-info
          success: chat-bubble-success
          warning: chat-bubble-warning
          error: chat-bubble-error
    slots:
      default:
        description: Message content displayed inside the bubble

  chat.image:
    template: lb/chat/image/index.html
    description: Avatar image displayed alongside the chat message
    base_classes:
    - chat-image
    - avatar
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      src:
        type: string
        default: ''
        description: Image source URL for the avatar
        required: false
      alt:
        type: string
        default: Avatar
        description: Alt text for the avatar image
        required: false
      size:
        type: enum
        values:
        - sm
        - md
        - lg
        default: md
        description: Avatar image size
        css_mapping:
          sm: w-8
          md: w-10
          lg: w-12
    slots:
      default:
        description: Custom avatar content (overrides automatic image rendering when src is not provided)

  chat.header:
    template: lb/chat/header.html
    description: Header text displayed above the chat bubble, typically showing the sender name
    base_classes:
    - chat-header
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
    slots:
      default:
        description: Header content such as sender name and timestamp

  chat.footer:
    template: lb/chat/footer.html
    description: Footer text displayed below the chat bubble, typically showing delivery status or timestamp
    base_classes:
    - chat-footer
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
    slots:
      default:
        description: Footer content such as delivery status or read receipts

  collapse:
    template: lb/collapse/index.html
    description: Standalone expandable section with a title and collapsible content area
    base_classes:
    - collapse
    optional_base_classes:
    - collapse-arrow
    - collapse-plus
    - collapse-open
    - collapse-title
    - collapse-content
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      style:
        type: enum
        values:
        - ''
        - arrow
        - plus
        default: ''
        description: Icon style shown on the collapse title
        css_mapping:
          arrow: collapse-arrow
          plus: collapse-plus
      open:
        type: boolean
        default: false
        description: Whether the collapse is initially open
        css_mapping:
          true: collapse-open
      title:
        type: string
        default: ''
        description: Title text for the collapse header (alternative to title slot)
        required: false
    slots:
      default:
        description: Collapsible content that appears when the collapse is expanded
      titleSlot:
        description: Custom title content including the collapse-title wrapper (overrides title attribute when provided)

  hover-gallery:
    template: lb/hover_gallery/index.html
    description: CSS-only image gallery that reveals different images on hover across horizontal columns
    base_classes:
    - hover-gallery
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      as:
        type: enum
        values:
        - figure
        - div
        default: figure
        description: HTML element to use as container
    slots:
      default:
        description: Image elements to display in the gallery

  hover3d:
    template: lb/hover3d/index.html
    description: CSS-only 3D tilt effect wrapper using 8 hover-zone divs to detect mouse position and apply rotation
    base_classes:
    - hover-3d
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false

  kbd:
    template: lb/kbd/index.html
    description: Keyboard key indicator to display keyboard shortcuts or key combinations
    base_classes:
    - kbd
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      size:
        type: enum
        values:
        - xs
        - sm
        - md
        - lg
        - xl
        default: md
        description: Size of the keyboard key
        css_mapping:
          xs: kbd-xs
          sm: kbd-sm
          md: kbd-md
          lg: kbd-lg
          xl: kbd-xl
      variant:
        type: enum
        default: ''
        description: Color variant for the keyboard key
        values:
        - ''
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
        css_mapping:
          neutral: bg-neutral/15 text-neutral border-neutral/25
          primary: bg-primary/15 text-primary border-primary/25
          secondary: bg-secondary/15 text-secondary border-secondary/25
          accent: bg-accent/15 text-accent border-accent/25
          info: bg-info/15 text-info border-info/25
          success: bg-success/15 text-success border-success/25
          warning: bg-warning/15 text-warning border-warning/25
          error: bg-error/15 text-error border-error/25
      icon:
        type: string
        default: ''
        description: Icon name to display
        required: false
        dot_modifiers:
          fill: Render in filled (solid) style
      icon.class:
        type: string
        default: ''
        description: Additional CSS classes for the icon
        required: false
    slots:
      default:
        description: Key label text

  list:
    template: lb/list/index.html
    description: List component for displaying information in vertical rows with horizontal layout
    base_classes:
    - list
    variables:
