        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      direction:
        type: enum
        values:
        - ''
        - horizontal
        - vertical
        default: ''
        description: Timeline layout direction
        css_mapping:
          horizontal: timeline-horizontal
          vertical: timeline-vertical
      compact:
        type: boolean
        default: false
        description: Force all items to one side
        css_mapping:
          true: timeline-compact
      snap:
        type: boolean
        default: false
        description: Align icon to start instead of middle
        css_mapping:
          true: timeline-snap-icon
    slots:
      default:
        description: Timeline items using timeline.item components

  timeline.item:
    template: lb/timeline/item.html
    description: Individual timeline event item with automatic hr connectors and convenience props for start, middle, and end
      content
    base_classes: []
    optional_base_classes:
    - timeline-start
    - timeline-middle
    - timeline-end
    - timeline-box
    variables:
      class:
        type: string
        default: ''
        description: Additional CSS classes to apply
        required: false
      first:
        type: boolean
        default: false
        description: Mark as the first item (no hr before)
      last:
        type: boolean
        default: false
        description: Mark as the last item (no hr after)
      icon:
        type: string
        default: ''
        description: Icon name to display
        required: false
        dot_modifiers:
          fill: Render in filled (solid) style
      icon.class:
        type: string
        default: ''
        description: Additional CSS classes for the icon
        required: false
      start:
        type: string
        default: ''
        description: Text content for the start section
        required: false
      startBox:
        type: boolean
        default: false
        description: Apply timeline-box styling to the start section
        css_mapping:
          true: timeline-box
      end:
        type: string
        default: ''
        description: Text content for the end section
        required: false
      endBox:
        type: boolean
        default: false
        description: Apply timeline-box styling to the end section
        css_mapping:
          true: timeline-box
      variant:
        type: enum
        default: ''
        description: Color variant applied to the icon and hr connectors
        values:
        - ''
        - neutral
        - primary
        - secondary
        - accent
        - info
        - success
        - warning
        - error
        css_mapping:
          neutral: bg-neutral / text-neutral
          primary: bg-primary / text-primary
          secondary: bg-secondary / text-secondary
          accent: bg-accent / text-accent
          info: bg-info / text-info
          success: bg-success / text-success
          warning: bg-warning / text-warning
          error: bg-error / text-error
    slots:
      default:
        description: Additional content or full manual control of the item
      startSlot:
        description: Custom start content (overrides start prop)
      middleSlot:
        description: Custom middle content (overrides icon prop)
      endSlot:
        description: Custom end content (overrides end prop)

