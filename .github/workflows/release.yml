name: Release

on:
  workflow_dispatch:
    inputs:
      release-issue:
        description: 'Main release issue number (e.g., 123)'
        required: true
        type: string

jobs:
  test:
    uses: ./.github/workflows/test-and-coverage.yml
    with:
      python-version: '3.12'
      upload-coverage: false

  checks:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      sub_issues_data: ${{ steps.check_sub_issues.outputs.data }}
      release_issue_data: ${{ steps.check_release_issue.outputs.data }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

          if [ -z "$VERSION" ]; then
            echo "❌ Failed to extract version from pyproject.toml"
            exit 1
          fi

      - name: Check all packages have the same version
        run: |
          ROOT_VERSION="${{ steps.version.outputs.version }}"

          # Extract version from docs package
          DOCS_VERSION=$(grep -E '^version = ' docs/pyproject.toml | sed 's/version = "\(.*\)"/\1/')

          # Extract version from icons package
          ICONS_VERSION=$(grep -E '^version = ' extras/icons/pyproject.toml | sed 's/version = "\(.*\)"/\1/')

          # Extract version from start package
          START_VERSION=$(grep -E '^version = ' extras/start/pyproject.toml | sed 's/version = "\(.*\)"/\1/')

          echo "Root package version: $ROOT_VERSION"
          echo "Docs package version: $DOCS_VERSION"
          echo "Icons package version: $ICONS_VERSION"
          echo "Start package version: $START_VERSION"

          # Check if all versions match
          if [ "$ROOT_VERSION" != "$DOCS_VERSION" ]; then
            echo "❌ Version mismatch: root ($ROOT_VERSION) != docs ($DOCS_VERSION)"
            exit 1
          fi

          if [ "$ROOT_VERSION" != "$ICONS_VERSION" ]; then
            echo "❌ Version mismatch: root ($ROOT_VERSION) != icons ($ICONS_VERSION)"
            exit 1
          fi

          if [ "$ROOT_VERSION" != "$START_VERSION" ]; then
            echo "❌ Version mismatch: root ($ROOT_VERSION) != start ($START_VERSION)"
            exit 1
          fi

          echo "✅ All packages have matching version: $ROOT_VERSION"

      - name: Check if tag already exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG_NAME="v$VERSION"

          if git tag -l | grep -q "^$TAG_NAME$"; then
            echo "❌ Tag $TAG_NAME already exists!"
            exit 1
          else
            echo "✅ Tag $TAG_NAME does not exist, proceeding..."
          fi

      - name: Check release issue is open
        id: check_release_issue
        run: |
          RELEASE_ISSUE="${{ github.event.inputs.release-issue }}"

          # Get the main release issue details
          RELEASE_ISSUE_DATA=$(gh issue view "$RELEASE_ISSUE" --json title,body,url,number,state 2>/dev/null || echo "")

          if [ -z "$RELEASE_ISSUE_DATA" ]; then
            echo "❌ Release issue #$RELEASE_ISSUE not found or not accessible"
            exit 1
          fi

          RELEASE_STATE=$(echo "$RELEASE_ISSUE_DATA" | jq -r '.state')
          RELEASE_TITLE=$(echo "$RELEASE_ISSUE_DATA" | jq -r '.title')

          echo "Release issue: $RELEASE_TITLE"
          echo "Release issue state: $RELEASE_STATE"

          # Handle both "open" and "OPEN" states from GitHub API
          if [ "$RELEASE_STATE" != "open" ] && [ "$RELEASE_STATE" != "OPEN" ]; then
            echo "❌ Release issue #$RELEASE_ISSUE is not open (state: $RELEASE_STATE). Please ensure it's open before releasing."
            exit 1
          else
            echo "✅ Release issue #$RELEASE_ISSUE is open"
          fi

          # Store release issue data for next job (using GitHub Actions file output)
          echo "data<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_ISSUE_DATA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check all sub-issues are closed
        id: check_sub_issues
        run: |
          RELEASE_ISSUE="${{ github.event.inputs.release-issue }}"

          echo "🔍 Checking sub-issues for release issue #$RELEASE_ISSUE"

          # Get sub-issues using the official GitHub API
          SUB_ISSUES_DATA=$(gh api repos/${{ github.repository }}/issues/$RELEASE_ISSUE/sub_issues 2>/dev/null || echo "[]")

          if [ "$SUB_ISSUES_DATA" = "[]" ] || [ -z "$SUB_ISSUES_DATA" ]; then
            echo "⚠️  No sub-issues found for release issue #$RELEASE_ISSUE"
          else
            echo "Found sub-issues:"
            echo "$SUB_ISSUES_DATA" | jq -r '.[] | "  #\(.number): \(.title) (\(.state))"'

            # Check each sub-issue
            echo "$SUB_ISSUES_DATA" | jq -r '.[] | "\(.number)|\(.title)|\(.state)"' | while IFS='|' read -r issue_num title state; do
              if [ "$state" != "closed" ] && [ "$state" != "CLOSED" ]; then
                echo "❌ Sub-issue #$issue_num ($title) is not closed"
                exit 1
              fi
            done

            echo "✅ All sub-issues are closed"
          fi

          # Store sub-issues data for next job (using GitHub Actions file output)
          echo "data<<EOF" >> $GITHUB_OUTPUT
          echo "$SUB_ISSUES_DATA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build-and-publish:
    needs: [test, checks]
    runs-on: ubuntu-latest
    if: always() && needs.checks.result == 'success'
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --with dev --no-interaction

      - name: Install dependencies (cached)
        if: steps.cached-poetry-dependencies.outputs.cache-hit == 'true'
        run: poetry install --with dev --no-root --no-interaction

      - name: Build main package
        run: |
          poetry build --no-interaction
          echo "✅ Main package built"

      - name: Verify main package build
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "❌ Error: dist directory is empty or doesn't exist"
            exit 1
          fi
          echo "✅ Distribution files built"

      - name: Build docs package
        run: |
          cd docs
          poetry build --no-interaction
          echo "✅ Docs package built"

      - name: Build icons package
        run: |
          cd extras/icons
          poetry build --no-interaction
          echo "✅ Icons package built"

      - name: Build start package
        run: |
          cd extras/start
          poetry build --no-interaction
          echo "✅ Start package built"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.checks.outputs.version }}
          path: |
            dist/
            docs/dist/
            extras/icons/dist/
            extras/start/dist/

      - name: Publish main package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
          verbose: true

      - name: Publish docs package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: docs/dist/
          print-hash: true
          verbose: true

      - name: Publish icons package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: extras/icons/dist/
          print-hash: true
          verbose: true

      - name: Publish start package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: extras/start/dist/
          print-hash: true
          verbose: true

  cleanup:
    needs: [test, checks, build-and-publish]
    runs-on: ubuntu-latest
    if: always() && needs.checks.result == 'success' && needs.build-and-publish.result == 'success'
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.checks.outputs.version }}
          path: artifacts/

      - name: Create and push tag
        run: |
          VERSION="${{ needs.checks.outputs.version }}"

          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Create tag from version
          TAG_NAME="v$VERSION"
          git tag "$TAG_NAME"

          # Push tag to remote
          git push origin "$TAG_NAME"

          echo "✅ Tag $TAG_NAME created and pushed"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.checks.outputs.version }}"
          TAG_NAME="v$VERSION"

          # Determine if this is a prerelease
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *"rc"* ]] || [[ "$VERSION" == *"a"* ]] || [[ "$VERSION" == *"b"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Create the release with GitHub CLI (auto-generates notes from PRs/commits)
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG

          echo "✅ GitHub release created"

      - name: Upload distribution files to release
        run: |
          VERSION="${{ needs.checks.outputs.version }}"
          TAG_NAME="v$VERSION"

          # Upload all wheel and tar.gz files to the release
          for file in artifacts/dist/*.whl artifacts/dist/*.tar.gz artifacts/docs/dist/*.whl artifacts/docs/dist/*.tar.gz artifacts/extras/icons/dist/*.whl artifacts/extras/icons/dist/*.tar.gz artifacts/extras/start/dist/*.whl artifacts/extras/start/dist/*.tar.gz; do
            if [ -f "$file" ]; then
              echo "Uploading $file to release..."
              gh release upload "$TAG_NAME" "$file" --clobber
            fi
          done

          echo "✅ All distribution files uploaded to release"

      # TODO: manually trigger deployment for now
      # - name: Trigger labbio deployment
      #   if: always() && needs.build-and-publish.result == 'success'
      #   run: |
      #     echo "📡 Triggering labbio deployment..."
      #     # curl -X POST "${{ secrets.DEPLOY_ENDPOINT }}"

      #     echo "✅ Labbio deployment triggered"

      - name: Close release issue
        run: |
          RELEASE_ISSUE="${{ github.event.inputs.release-issue }}"
          VERSION="${{ needs.checks.outputs.version }}"

          # Close the main release issue with release note
          gh issue close "$RELEASE_ISSUE" --comment "🎉 **Released in v$VERSION**

          This release issue has been completed and v$VERSION has been published.

          ### 📦 Installation
          \`\`\`bash
          # Core UI components
          pip install labbui==$VERSION

          # Optional packages
          pip install labbicons==$VERSION  # Icon components
          pip install labbdocs==$VERSION   # Documentation
          pip install labbstart==$VERSION  # Project starter CLI
          \`\`\`

          ### 📋 Release Notes
          - [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/v$VERSION)
          - [PyPI - labbui](https://pypi.org/project/labbui/$VERSION/)
          - [PyPI - labbicons](https://pypi.org/project/labbicons/$VERSION/)
          - [PyPI - labbdocs](https://pypi.org/project/labbdocs/$VERSION/)
          - [PyPI - labbstart](https://pypi.org/project/labbstart/$VERSION/)

          ---

          *This release issue was automatically closed as part of the v$VERSION release.*"

          echo "✅ Release issue #$RELEASE_ISSUE closed"

  notify:
    needs: [test, checks, build-and-publish, cleanup]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify on success
        if: |
          needs.test.result == 'success' &&
          needs.checks.result == 'success' &&
          needs.build-and-publish.result == 'success' &&
          needs.cleanup.result == 'success'
        run: |
          echo "✅ Release v${{ needs.checks.outputs.version }} completed successfully!"
          echo "📦 Packages published to PyPI"
          echo "🏷️  GitHub release created"
          echo "🚀 Tag created and pushed"
          echo "🔒 Release issue closed with release notes"

      - name: Notify on failure
        if: |
          needs.test.result == 'failure' ||
          needs.checks.result == 'failure' ||
          needs.build-and-publish.result == 'failure' ||
          needs.cleanup.result == 'failure'
        run: |
          echo "❌ Release failed at one of the following stages:"
          echo "   Test: ${{ needs.test.result }}"
          echo "   Checks: ${{ needs.checks.result }}"
          echo "   Build and Publish: ${{ needs.build-and-publish.result }}"
          echo "   Cleanup: ${{ needs.cleanup.result }}"
          echo ""
          echo "Please check the workflow logs for details"
