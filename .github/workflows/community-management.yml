name: Community Management

on:
  workflow_call:
    inputs:
      item-type:
        description: 'Type of item (issue or pr)'
        required: true
        type: string
      item-number:
        description: 'Number of the issue or PR'
        required: true
        type: string
      author:
        description: 'Author of the issue or PR'
        required: true
        type: string

jobs:
  check-and-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check if author is a member
        id: check_member
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          AUTHOR="${{ inputs.author }}"

          # Check if author is the repository owner
          REPO_OWNER=$(gh api repos/${{ github.repository }} --jq '.owner.login' 2>/dev/null)

          if [ "$AUTHOR" = "$REPO_OWNER" ]; then
            echo "is_member=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if author is a repository collaborator
          COLLABORATOR_RESPONSE=$(gh api repos/${{ github.repository }}/collaborators/$AUTHOR 2>&1 || echo "")
          COLLABORATORS_LIST=$(gh api repos/${{ github.repository }}/collaborators --jq '.[].login' 2>&1 || echo "")

          if echo "$COLLABORATOR_RESPONSE" | grep -q '"permissions"'; then
            COLLABORATOR_PERMS=$(echo "$COLLABORATOR_RESPONSE" | jq -r '.permissions' 2>/dev/null)
            if [ -n "$COLLABORATOR_PERMS" ] && [ "$COLLABORATOR_PERMS" != "null" ] && [ "$COLLABORATOR_PERMS" != "{}" ]; then
              echo "is_member=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          elif echo "$COLLABORATORS_LIST" | grep -q "$AUTHOR"; then
            echo "is_member=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if author is an organization member
          ORG_NAME=$(gh api repos/${{ github.repository }} --jq '.owner.login' 2>/dev/null)
          ORG_MEMBER_RESPONSE=$(gh api orgs/$ORG_NAME/members/$AUTHOR 2>&1 || echo "")
          ORG_MEMBERS_RESPONSE=$(gh api orgs/$ORG_NAME/members --jq '.[].login' 2>&1 || echo "")
          ORG_PUBLIC_MEMBERS=$(gh api orgs/$ORG_NAME/public_members --jq '.[].login' 2>&1 || echo "")

          if echo "$ORG_MEMBER_RESPONSE" | grep -q '"login"'; then
            echo "is_member=true" >> $GITHUB_OUTPUT
            exit 0
          elif echo "$ORG_MEMBERS_RESPONSE" | grep -q "$AUTHOR"; then
            echo "is_member=true" >> $GITHUB_OUTPUT
            exit 0
          elif echo "$ORG_PUBLIC_MEMBERS" | grep -q "$AUTHOR"; then
            echo "is_member=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Author is not a member
          echo "is_member=false" >> $GITHUB_OUTPUT

      - name: Close item from non-member
        if: steps.check_member.outputs.is_member == 'false'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          # Determine the command based on item type
          if [ "${{ inputs.item-type }}" = "issue" ]; then
            COMMAND="gh issue close ${{ inputs.item-number }}"
            ITEM_NAME="issue"
          else
            COMMAND="gh pr close ${{ inputs.item-number }}"
            ITEM_NAME="pull request"
          fi

          # Close the item with explanation
          $COMMAND --comment "👋 Thanks for your interest in labb!

          **We don't accept issues or pull requests at this time.** This repository is in an early stage of development.

          ### 💬 Please use GitHub Discussions instead

          We encourage and welcome community participation through Discussions:

          - **[Bug Reports](https://github.com/labbhq/labb/discussions/categories/bug-reports)** - Report bugs and issues
          - **[Feature Requests](https://github.com/labbhq/labb/discussions/categories/feature-requests)** - Suggest new features
          - **[Q&A](https://github.com/labbhq/labb/discussions/categories/q-a)** - Ask questions and get help
          - **[General](https://github.com/labbhq/labb/discussions)** - Share feedback and ideas

          This helps us keep everything organized and makes it easier for the community to participate in conversations.

          ---

          *This is an automated message.*"
