name: Test and Coverage

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.12'
      upload-coverage:
        description: 'Whether to upload coverage reports'
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labbdocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/0.12.3/install.sh | sh

      - name: Add UV to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify UV installation
        run: uv --version

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --with dev

      - name: Install dependencies (cached)
        if: steps.cached-poetry-dependencies.outputs.cache-hit == 'true'
        run: poetry install --with dev --no-root

      - name: Run linting
        run: |
          poetry run ruff format --check
          poetry run ruff check --select I

      - name: Run library tests
        run: poetry run pytest --cov=labb --cov=labbstart --cov-report=xml --cov-report=html

      - name: Fail if the search tests would skip
        run: |
          poetry run python - <<'PY'
          import os, sys
          sys.path.insert(0, "docs")
          os.environ["DJANGO_SETTINGS_MODULE"] = "tests.settings"
          from django.conf import settings
          if settings.SEARCH_SKIP_REASON:
              sys.exit(f"search tests would not run: {settings.SEARCH_SKIP_REASON}")
          PY

      - name: Run labbdocs tests
        run: poetry run pytest -c docs/pytest.ini docs --cov=labbdocs --cov-append --cov-report=xml

      - name: Run icons tests
        run: poetry run pytest extras/icons

      - name: Run start tests
        run: poetry run pytest extras/start

      # --with local: the path deps on labbui/labbicons sit in an optional group,
      # so a plain install would test against the released labbui, not this branch.
      - name: Run blocks tests
        working-directory: extras/blocks
        run: |
          poetry install --with local --no-root
          poetry run playwright install --with-deps chromium
          poetry run pytest

      - name: Upload coverage reports
        if: inputs.upload-coverage == true
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
